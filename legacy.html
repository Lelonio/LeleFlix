<style>
    /* Stili Overlay Cast (Invariati) */
    #cast-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
    }
    #cast-overlay.active {
        display: flex;
        opacity: 1;
        pointer-events: auto;
    }
    .cast-icon-wrapper {
        position: relative;
        width: 100px; height: 100px;
        display: flex; display: -webkit-flex;
        align-items: center; justify-content: center;
        background-color: #E50914;
        border-radius: 50%;
        margin-bottom: 30px;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        z-index: 2;
    }
    .cast-ripple {
        position: absolute; top: 50%; left: 50%;
        -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
        width: 100px; height: 100px;
        border: 2px solid rgba(229, 9, 20, 0.8);
        border-radius: 50%;
        -webkit-animation: ripple 2s linear infinite; animation: ripple 2s linear infinite;
        z-index: 1;
    }
    .cast-ripple:nth-child(2) { -webkit-animation-delay: 0.5s; animation-delay: 0.5s; }
    .cast-ripple:nth-child(3) { -webkit-animation-delay: 1s; animation-delay: 1s; }
    @-webkit-keyframes ripple {
        0% { width: 100px; height: 100px; opacity: 0.8; border-width: 4px; }
        100% { width: 300px; height: 300px; opacity: 0; border-width: 0px; }
    }
    @keyframes ripple {
        0% { width: 100px; height: 100px; opacity: 0.8; border-width: 4px; }
        100% { width: 300px; height: 300px; opacity: 0; border-width: 0px; }
    }
    .cast-text { color: white; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .cast-subtext { color: #a3a3a3; font-size: 18px; }
</style>

<script>
    (function() {
        var socket = io('https://vixprx.dpdns.org/'); // Assicurati che l'URL sia corretto

        function showCastAnimation(title) {
            var overlay = document.getElementById('cast-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'cast-overlay';
                var html = '';
                html += '<div class="cast-icon-wrapper">';
                html += '  <i class="fas fa-satellite-dish" style="color:white; font-size:40px;"></i>';
                html += '  <div class="cast-ripple"></div><div class="cast-ripple"></div><div class="cast-ripple"></div>';
                html += '</div>';
                html += '<div class="cast-text">Ricezione segnale LeleCast...</div>';
                html += '<div class="cast-subtext" id="cast-title">Preparazione: ' + (title || '') + '</div>';
                overlay.innerHTML = html;
                document.body.appendChild(overlay);
            } else {
                document.getElementById('cast-title').textContent = 'Preparazione: ' + (title || '');
            }
            setTimeout(function() { overlay.className = 'active'; }, 10);
            return overlay;
        }

        socket.on('connect', function() {
            console.log("TV connessa a LeleCast");
        });

        socket.on('remote_play_trigger', function(content) {
            console.log("Comando ricevuto:", content);
            
            // 1. Mostra animazione
            showCastAnimation(content.title || content.name);

            // 2. Chiudi eventuali pagine dettagli aperte
            var details = document.getElementById('series-details-page');
            if (details) details.style.display = 'none';

            // 3. Avvia il player dopo 1.5s
            setTimeout(function() {
                var type = content.media_type || 'movie';
                var id = content.id;
                
                // Costruisci URL per player.html
                var targetUrl = '';
                
                if (type === 'tv') {
                    var season = content.season_number || 1;
                    var episode = content.episode_number || 1;
                    targetUrl = 'player.html?tvId=' + id + '&season=' + season + '&episode=' + episode + '&type=tv';
                } else {
                    targetUrl = 'player.html?movieId=' + id + '&type=movie';
                }

                // Esegui il redirect
                window.location.href = targetUrl;
                
            }, 1500);
        });
    })();
</script>


<style>

/* --- ANIMAZIONI PAGINA DETTAGLI --- */

/* Keyframes */
@keyframes pageFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUpFade {
    from { 
        opacity: 0; 
        transform: translateY(40px); 
    }
    to { 
        opacity: 1; 
        transform: translateY(0); 
    }
}

@keyframes backdropEntry {
    from { 
        opacity: 0; 
        transform: scale(1.1); 
    }
    to { 
        opacity: 0.6; /* Il valore finale che avevi nel CSS originale */
        transform: scale(1); 
    }
}

@keyframes fadeOutExit {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* Applicazione Animazioni all'apertura */

/* 1. Il contenitore principale appare dolcemente */
.details-page-view {
    animation: pageFadeIn 0.4s ease-out forwards;
}

/* 2. Lo sfondo fa un leggero zoom-out e fade-in */
.hero-backdrop {
    /* Sovrascriviamo l'opacity base per lasciarla gestire all'animazione */
    opacity: 0; 
    animation: backdropEntry 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* 3. La colonna sinistra (Info) entra dal basso con ritardo */
.details-left-col, .details-info-top {
    opacity: 0; /* Parte nascosto */
    animation: slideUpFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.2s; /* Aspetta un attimo */
}

/* 4. La colonna destra (Episodi/Simili) entra dopo la sinistra */

    opacity: 0; /* Parte nascosto */
    animation: slideUpFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;

/* --- FIX CLIPPING (TAGLIO CARD) --- */

    display: flex;
    overflow-x: auto;
    /* Aumentiamo drasticamente il padding verticale per ospitare lo zoom */
    padding: 40px 50px; 
    
    /* Usiamo margini negativi per compensare il padding visivamente */
    margin-top: -20px;
    margin-bottom: -20px;
    
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    
    /* Nascondi scrollbar */
    scrollbar-width: none;
}

TizenNavigation.prototype.ensureHeaderVisibleGently = function() {

TizenNavigation.prototype.focusElement = function(index) {

  // Migliora l'animazione dello scroll
  var originalSmoothScrollTo = TizenNavigation.prototype.smoothScrollTo;
  TizenNavigation.prototype.smoothScrollTo = function(targetPosition, callback) {
  var startPosition = window.pageYOffset;
  var distance = targetPosition - startPosition;
  
  // Se la distanza è piccola, non animare
  if (Math.abs(distance) < 5) {
    window.scrollTo(0, targetPosition);
    if (typeof callback === 'function') {
      callback();
    }
    return;
  }

  var startTime = performance.now();
  var duration = Math.min(Math.abs(distance) * 0.8, 800);

  // Usa una curva di easing più fluida
  var easeOutQuart = function(t) { 
    return 1 - (--t) * t * t * t;
  };
  
  var self = this;

  var animationFrame = function(currentTime) {
    var elapsed = currentTime - startTime;
    var progress = Math.min(elapsed / duration, 1);
    var easedProgress = easeOutQuart(progress);
    
    window.scrollTo(0, startPosition + distance * easedProgress);
    
    if (progress < 1) {
      requestAnimationFrame(animationFrame);
    } else if (typeof callback === 'function') {
      callback();
    }
  };

  requestAnimationFrame(animationFrame);
};

// Polyfill per scroll-behavior smooth
if (!('scrollBehavior' in document.documentElement.style)) {
  (function() {
    function smoothScrollPolyfill() {
      const originalScrollTo = Element.prototype.scrollTo;
      Element.prototype.scrollTo = function(options) {
        if (options && options.behavior === 'smooth') {
          const start = this.scrollLeft;
          const change = options.left - start;
          const startTime = performance.now();
          const duration = 300;

          const animateScroll = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            this.scrollLeft = start + change * progress;
            
            if (progress < 1) {
              requestAnimationFrame(animateScroll);
            }
          };
          
          requestAnimationFrame(animateScroll);
        } else {
          originalScrollTo.apply(this, arguments);
        }
      };
    }
    
    if (document.readyState === 'complete') {
      smoothScrollPolyfill();
    } else {
      window.addEventListener('load', smoothScrollPolyfill);
    }
  })();
}

  <script>

/* --- LOGICA RICERCHE RECENTI (ES5) --- */

// Carica e renderizza le ricerche all'avvio
function initRecentSearches() {
    renderRecentSearches();
}

// Recupera array dal localStorage
function getRecentSearches() {
    try {
        var saved = localStorage.getItem('leleflix_recent_searches');
        return saved ? JSON.parse(saved) : [];
    } catch (e) { return []; }
}

// Salva una nuova ricerca
function saveSearchTerm(query) {
    if (!query || query.trim().length < 2) return; // Ignora ricerche troppo corte
    
    var searches = getRecentSearches();
    var term = query.trim();
    
    // Rimuovi se esiste già (per spostarlo in cima)
    var index = -1;
    for(var i=0; i<searches.length; i++) {
        if(searches[i].toLowerCase() === term.toLowerCase()) {
            index = i;
            break;
        }
    }
    if (index > -1) searches.splice(index, 1);
    
    // Aggiungi in testa
    searches.unshift(term);
    
    // Mantieni solo gli ultimi 8
    if (searches.length > 8) searches.pop();
    
    localStorage.setItem('leleflix_recent_searches', JSON.stringify(searches));
    renderRecentSearches();
}

// Renderizza i chip nell'HTML
function renderRecentSearches() {
    var wrapper = document.getElementById('recent-searches-wrapper');
    var container = document.getElementById('recent-searches-container');
    var searches = getRecentSearches();
    
    // Se non ci sono ricerche, nascondi la sezione
    if (searches.length === 0) {
        wrapper.style.display = 'none';
        return;
    }
    
    // Mostra la sezione
    wrapper.style.display = 'flex';
    
    var html = '';
    
    // Crea i chip per ogni ricerca
    for (var i = 0; i < searches.length; i++) {
        var term = searches[i];
        // Nota: escape degli apici per l'onclick
        var safeTerm = term.replace(/'/g, "\\'");
        
        html += '<div class="recent-chip focusable" tabindex="0" ' +
                'onclick="performSavedSearch(\'' + safeTerm + '\')">' +
                '<i class="fas fa-history"></i> ' + term +
                '</div>';
    }
    
    // Aggiungi pulsante "Pulisci" alla fine
    if (searches.length > 0) {
        html += '<div class="recent-chip clear-btn focusable" tabindex="0" ' +
                'onclick="clearRecentSearches()">' +
                '<i class="fas fa-trash-alt"></i> Pulisci' +
                '</div>';
    }
    
    container.innerHTML = html;
    
    // Aggiorna navigazione se disponibile
    if (typeof navigation !== 'undefined' && navigation) {
        navigation.refreshFocusableElements();
    }
}

// Esegue una ricerca salvata

    var input = document.getElementById('search-input');
    input.value = term;
    searchMedia(); // Chiama la tua funzione di ricerca esistente
}

    localStorage.removeItem('leleflix_recent_searches');
    renderRecentSearches();
    
    // Riporta focus sull'input di ricerca dopo aver cancellato

    if (input) input.focus();

// Funzione per ottenere l'IP del client (ES5 compatibile)
function getClientIP(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.ipify.org?format=json', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          callback(data.ip);
        } catch (e) {
          callback('anon-' + navigator.userAgent.substring(0, 10) + '-' + Date.now());
        }
      } else {
        callback('anon-' + navigator.userAgent.substring(0, 10) + '-' + Date.now());
      }
    }
  };
  xhr.send();
}

// Funzione per ottenere i contenuti da continuare a guardare
function getContinueWatching(callback) {
  
  getClientIP(function(ip) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://vixprx.dpdns.org/progress/' + encodeURIComponent(ip), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            callback(data.progress || []);
          } catch (e) {
            console.error('Error parsing progress data:', e);
            callback([]);
          }
        } else {
          console.error('Error fetching progress:', xhr.status);
          callback([]);
        }
      }
    };
    xhr.send();
  });
}

// Funzione per visualizzare la sezione "Continua a guardare"

var posterCache = {};

// Funzione per ottenere i dettagli del poster da TMDB (ES5 compatibile)
function getPosterDetails(tmdbId, contentType, callback) {
  // Controlla se abbiamo già questo poster in cache
  var cacheKey = contentType + '-' + tmdbId;
  if (posterCache[cacheKey]) {
    callback(posterCache[cacheKey]);
    return;
  }
  
  var type = contentType === 'movie' ? 'movie' : 'tv';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.themoviedb.org/3/' + type + '/' + tmdbId + '?api_key=1e8c9083f94c62dd66fb2105cd7b613b&language=it-IT', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var posterPath = data.poster_path;
          
          // Salva in cache
          posterCache[cacheKey] = posterPath;
          
          callback(posterPath);
        } catch (e) {
          console.error('Error parsing poster data:', e);
          callback(null);
        }
      } else {
        console.error('Error fetching poster:', xhr.status);
        callback(null);
      }
    }
  };
  xhr.send();
}

// Funzione modificata per visualizzare la sezione "Continua a guardare"

// Funzione modificata per visualizzare "Continua a guardare" con fix animazione
// Funzione modificata per visualizzare "Continua a guardare" in orizzontale
function displayContinueWatching() {
  getContinueWatching(function(progressItems) {
    var continueSection = document.getElementById('continue-watching');
    var continueRow = document.getElementById('continue-watching-row');

    if (!progressItems || progressItems.length === 0) {
      if (continueSection) continueSection.style.display = 'none';
      return;
    }
    
    continueSection.style.display = 'block';
    // Fix animazione entrata
    setTimeout(function() { continueSection.classList.add('animate-in'); }, 100);
    
    continueRow.innerHTML = '<div style="width:100%; text-align:center; padding:20px; color:#aaa;"><i class="fas fa-spinner fa-spin"></i> Caricamento...</div>';
    
    var itemsToShow = progressItems.slice(0, 10);
    var imagePromises = [];
    
    // Recupera i BACKDROP (immagini orizzontali) invece dei poster
    itemsToShow.forEach(function(item) {
      var promise = new Promise(function(resolve) {
        // Usiamo getBackdropPath che è già presente nel tuo codice (usato per lo sfondo dinamico)
        // Se non dovesse esistere, fammelo sapere che ti fornisco la funzione
        if (typeof getBackdropPath === 'function') {
            getBackdropPath(item.tmdbId, item.contentType, function(backdropPath) {
              resolve({ item: item, imagePath: backdropPath, isBackdrop: true });
            });
        } else {
            // Fallback se la funzione non esiste (usa poster)
            getPosterDetails(item.tmdbId, item.contentType, function(posterPath) {
              resolve({ item: item, imagePath: posterPath, isBackdrop: false });
            });
        }
      });
      imagePromises.push(promise);
    });
    
    Promise.all(imagePromises).then(function(itemsWithImages) {
      continueRow.innerHTML = '';
      
      itemsWithImages.forEach(function(data) {
        var item = data.item;
        var imagePath = data.imagePath;
        var progressPercentage = item.progressPercentage || 0;
        
        // Costruisci URL immagine (Backdrop o Poster fallback)
        var imageUrl = '';

// Polyfill per Promise se non supportato (per compatibilità con browser più vecchi)
if (typeof Promise === 'undefined') {
  (function() {
    function Promise(fn) {
      var state = 'pending';
      var value;
      var deferred = null;

      function resolve(newValue) {
        try {
          if (newValue && typeof newValue.then === 'function') {
            newValue.then(resolve, reject);
            return;
          }
          state = 'resolved';
          value = newValue;

          if (deferred) {
            handle(deferred);
          }
        } catch (e) {
          reject(e);
        }
      }

      function reject(reason) {
        state = 'rejected';
        value = reason;

        if (deferred) {
          handle(deferred);
        }
      }

      function handle(handler) {
        if (state === 'pending') {
          deferred = handler;
          return;
        }

        setTimeout(function() {
          var handlerCallback;

          if (state === 'resolved') {
            handlerCallback = handler.onResolved;
          } else {
            handlerCallback = handler.onRejected;
          }

          if (!handlerCallback) {
            if (state === 'resolved') {
              handler.resolve(value);
            } else {
              handler.reject(value);
            }
            return;
          }

          try {
            var ret = handlerCallback(value);
            handler.resolve(ret);
          } catch (e) {
            handler.reject(e);
          }
        }, 0);
      }

      this.then = function(onResolved, onRejected) {
        return new Promise(function(resolve, reject) {
          handle({
            onResolved: onResolved,
            onRejected: onRejected,
            resolve: resolve,
            reject: reject
          });
        });
      };

      fn(resolve, reject);
    }

    Promise.all = function(promises) {
      return new Promise(function(resolve, reject) {
        var results = [];
        var remaining = promises.length;

        if (remaining === 0) {
          resolve(results);
          return;
        }

        function res(i, val) {
          try {
            if (val && typeof val.then === 'function') {
              val.then(function(val) {
                res(i, val);
              }, reject);
              return;
            }
            results[i] = val;
            if (--remaining === 0) {
              resolve(results);
            }
          } catch (ex) {
            reject(ex);
          }
        }

        for (var i = 0; i < promises.length; i++) {
          res(i, promises[i]);
        }
      });
    };

    window.Promise = Promise;
  })();
}

function goToHome() {
    // Rimuovi classi di focus residue
    var focusedElements = document.querySelectorAll('.tv-focused');
    for (var i = 0; i < focusedElements.length; i++) {
        focusedElements[i].classList.remove('tv-focused');
        focusedElements[i].blur();
    }

    // Nascondi i risultati di ricerca
    document.getElementById("search-results").style.display = 'none';
    
    // Mostra tutte le sezioni nascoste
    var allSections = document.querySelectorAll('.rows-container');
    for (var j = 0; j < allSections.length; j++) {
        if (allSections[j].id !== 'search-results') {
            allSections[j].style.display = 'block';
        }
    }
    renderRecentSearches();
    
    // Resetta il campo di ricerca
    document.getElementById("search-input").value = '';
    
    // Scrolla in cima alla pagina
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // Pulisci lo stack di modali
    if (navigation && navigation.stateStack) {
        navigation.stateStack = [];
    }

    // Forza refresh dei focusable e imposta il primo
    if (navigation) {
        navigation.refreshFocusableElements();
        // Focus sul primo elemento dopo un breve delay
        setTimeout(function() {
            if (navigation.focusableElements.length > 0) {
                navigation.focusElement(0);
            }
        }, 100);
    }
}

function closeModalUI() {
    var playerContainer = document.getElementById("player-container");
    if (!playerContainer) return;

    // 1. Se per qualche motivo c'è un video aperto (es. se la modale è sovrapposta
    // a un player) lo puliamo, ma NON distruggiamo HLS se non serve:
    if (window.hls) {
        try {
            window.hls.destroy();
        } catch (e) {
            console.warn('Errore distruggendo hls in closeModalUI:', e);
        }
        window.hls = null;
    }
    var video = playerContainer.querySelector('video');
    if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
    }

    // 2. Nascondi / svuota la UI della modale
    playerContainer.innerHTML = '';
    playerContainer.style.display = 'none';

    // 3. Ripristina il focus precedente se presente
    var prevId = playerContainer.dataset.previousFocus;
    if (prevId) {
        var prevEl = document.getElementById(prevId);
        if (prevEl) {
            try {
                prevEl.focus();
                // console.log('Focus ripristinato su elemento precedente:', prevEl);
            } catch (e) {
                console.warn('Impossibile ripristinare il focus precedente:', e);
            }
        }
        delete playerContainer.dataset.previousFocus;
    }

    // 4. Aggiorna navigazione
    if (typeof navigation !== 'undefined' && navigation) {
        if (typeof navigation.refreshFocusableElements === 'function') {
            navigation.refreshFocusableElements();
        }
        // Fallback: se esiste helper per il primo elemento
        if (typeof navigation.focusFirstElement === 'function') {
            navigation.focusFirstElement();
        } else if (typeof navigation.focusElement === 'function') {
            // prova a rifocalizzare l'indice corrente (se valido)
            navigation.focusElement(navigation.currentIndex || 0);
        }
    }
}

// Sistema di navigazione ottimizzato specificamente per Tizen TV (versione ES5)
function TizenNavigation() {
    this.focusableElements = [];
    this.currentIndex = 0;
    this.isInitialized = false;
    this.isScrolling = false;
    this.lastScrollTime = 0;
    this.scrollDuration = 300;
    
    this.init();
    this.setupScrollHandlers();
    // Dentro il costruttore o come proprietà:
this.stateStack = [];

}

// Metodo init
TizenNavigation.prototype.init = function() {
    // Aspetta che il DOM sia completamente caricato
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', this.setup.bind(this));
    } else {
        this.setup();
    }
};

TizenNavigation.prototype.pushState = function(state) {
    this.stateStack.push(state);
};

TizenNavigation.prototype.popState = function() {
    return this.stateStack.pop();
};

TizenNavigation.prototype.peekState = function() {
    return this.stateStack[this.stateStack.length - 1];
};


// Metodo setup
TizenNavigation.prototype.setup = function() {
    // console.log('🔥 Inizializzando navigazione Tizen TV');
    
    // Gestisci eventi tastiera per navigazione con priorità alta
    document.addEventListener('keydown', this.handleKeyDown.bind(this), true);
    
    // Forza la disabilitazione della navigazione nativa Tizen
    this.disableTizenNativeNavigation();
    
    // Inizializza elementi focusable con delay per permettere il rendering
    var self = this;
    setTimeout(function() {
        self.refreshFocusableElements();
        self.focusFirstElement();
        self.isInitialized = true;
    }, 200);
};

// Metodo disableTizenNativeNavigation
TizenNavigation.prototype.disableTizenNativeNavigation = function() {
    // Disabilita la navigazione spaziale nativa di Tizen
    try {
        // Rimuovi attributi di navigazione spaziale nativi
        var elements = document.querySelectorAll('[spatial-navigation-action]');
        Array.prototype.forEach.call(elements, function(el) {
            el.removeAttribute('spatial-navigation-action');
        });
        
        // Disabilita focus automatico
        document.body.setAttribute('spatial-navigation', 'none');
        
        // console.log('✅ Navigazione nativa Tizen disabilitata');
    } catch (e) {
        console.warn('Impossibile disabilitare navigazione nativa:', e);
    }
};

// Metodo handleKeyDown
TizenNavigation.prototype.handleKeyDown = function(event) {
    if (!this.isInitialized) return;
    
    var keyCode = event.keyCode;
    
    // Intercetta TUTTI i tasti di navigazione prima che Tizen li gestisca
    if ([37, 38, 39, 40, 13, 27, 461, 10009].includes(keyCode)) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    }

     console.log('🎮 Tasto premuto:', keyCode);

    switch(keyCode) {
        case 37: // Freccia sinistra
            this.navigateLeft();
            break;
        case 39: // Freccia destra  
            this.navigateRight();
            break;
        case 38: // Freccia su
            this.navigateUp();
            break;
        case 40: // Freccia giù
            this.navigateDown();
            break;
        case 13: // Tizen Enter
            this.activateCurrentElement();
            break;
        case 27: // Back
        case 10009: // Tizen Back
            this.handleBack();
            break;

    }
};

// Metodo refreshFocusableElements
TizenNavigation.prototype.refreshFocusableElements = function() {
    // Trova tutti gli elementi focusable visibili con controlli più rigidi
    var elements = document.querySelectorAll('.focusable');
    this.focusableElements = Array.prototype.filter.call(elements, function(el) {
        var rect = el.getBoundingClientRect();
        var style = window.getComputedStyle(el);
        
        return (
            rect.width > 0 && 
            rect.height > 0 && 
            style.display !== 'none' && 
            style.visibility !== 'hidden' &&
            el.offsetParent !== null
        );
    });
    
    // console.log('🎯 Elementi focusable trovati:', this.focusableElements.length, this.focusableElements);
    
    // Se l'indice corrente è fuori range, resettalo
    if (this.currentIndex >= this.focusableElements.length) {
        this.currentIndex = 0;
    }
};

// Metodo focusFirstElement
TizenNavigation.prototype.focusFirstElement = function() {
    if (this.focusableElements.length > 0) {
        this.focusElement(2);
        // console.log('👆 Focus iniziale impostato');
    }
};

// Metodo focusElement


// Metodo setupScrollHandlers
TizenNavigation.prototype.setupScrollHandlers = function() {
    var lastScrollPosition = 0;
    var self = this;
    
    window.addEventListener('scroll', function() {
        var currentScrollPosition = window.pageYOffset;
        var navbar = document.querySelector('.navbar');
        
        if (currentScrollPosition > lastScrollPosition && currentScrollPosition > 100) {
            // Scrolling down
            if (navbar) navbar.classList.add('hidden');
        } else {
            // Scrolling up
            if (navbar) navbar.classList.remove('hidden');
        }
        
        lastScrollPosition = currentScrollPosition;
    });
};

// Metodo scrollIntoViewForTizen
TizenNavigation.prototype.scrollIntoViewForTizen = function(element) {
    var row = element.closest('.row') || element.closest('.similar-row-scroll');
    if (!row) return;

    var rowRect = row.getBoundingClientRect();
    var elementRect = element.getBoundingClientRect();
    var rowScrollLeft = row.scrollLeft;
    var rowWidth = row.clientWidth;
    
    // Calcola posizione per centrare
    var elementLeft = elementRect.left - rowRect.left + rowScrollLeft;
    var targetPosition = elementLeft - (rowWidth / 2) + (elementRect.width / 2);
    
    // Scroll fluido nativo/polyfill (senza callback bloccanti)
    row.scrollTo({
        left: targetPosition,
        behavior: 'smooth'
    });
};

// Metodo navigateLeft
TizenNavigation.prototype.navigateLeft = function() {
    var current = this.focusableElements[this.currentIndex];
    if (!current) return;

    // 1. Navigazione INTERNA alla riga (Veloce/Standard)
    if (current.closest('.row') || current.closest('.similar-row-scroll')) {
        var parentRow = current.closest('.row') || current.closest('.similar-row-scroll');
        var rowItems = Array.prototype.slice.call(parentRow.querySelectorAll('.focusable'));
        var currentRowIndex = rowItems.indexOf(current);
        
        // Se c'è un elemento precedente NELLA STESSA RIGA
        if (currentRowIndex > 0) {
            var prevRowItem = rowItems[currentRowIndex - 1];
            var globalIndex = this.focusableElements.indexOf(prevRowItem);
            if (globalIndex !== -1) {
                // USA IL METODO STANDARD (Immediato)
                this.focusElement(globalIndex);
                return;
            }
        }
    }
    
    // 2. Navigazione ESTERNA (Cambio Riga/Sezione) -> Usa effetto FLUIDO

TizenNavigation.prototype.navigateUp = function() {

                var dist = Math.sqrt(dx*dx + dy*dy);

                }
            }
        }

        if (bestMatch !== -1) {
            // Scroll standard non bloccante
            this.focusElement(bestMatch);

      }
  }

  var targetElement = null;
  var targetIndex = -1;

  var currentRowContainer = current.closest('.rows-container');

      if (currentContainerIndex > 0) {

              for (var i = 0; i < targetItems.length; i++) {
                  var item = targetItems[i];
                  var rect = item.getBoundingClientRect();
                  var centerX1 = currentRect.left + (currentRect.width / 2);
                  var centerX2 = rect.left + (rect.width / 2);
                  var diffX = Math.abs(centerX1 - centerX2);

                  if (diffX < minDiffX) {
                      minDiffX = diffX;

                      targetIndex = this.focusableElements.indexOf(item);
                  }

      // SE SIAMO NEL PRIMO CONTAINER (indice 0)

          // Cerchiamo geometricamente sopra
      }
  }

  // --- LOGICA GEOMETRICA (Fallback se non abbiamo trovato tramite righe) ---
  if (!targetElement) {
      var currentRect = current.getBoundingClientRect();
      var bestDistance = Infinity;

      for (var i = 0; i < this.focusableElements.length; i++) {
        var element = this.focusableElements[i];
        if (i === this.currentIndex) continue;
        
        var rect = element.getBoundingClientRect();
        
        if (rect.bottom <= currentRect.top + 20) {
          var distY = currentRect.top - rect.bottom;
          var distX = Math.abs((rect.left + rect.width / 2) - (currentRect.left + currentRect.width / 2));
          var totalDist = distY + (distX * 0.5);

          if (totalDist < bestDistance) {
            bestDistance = totalDist;
            targetElement = element;
            targetIndex = i;
          }
        }
      }
  }

  // --- ESECUZIONE MOVIMENTO (FIX FLUIDITÀ) ---
  if (targetElement && targetIndex !== -1) {
      var self = this;
      var targetRow = targetElement.closest('.rows-container');

      if (targetRow) {

          var navbar = document.querySelector('.navbar');

          var targetPosition = targetRow.getBoundingClientRect().top + window.pageYOffset - navbarHeight - 20;
          
          // 2. Esegui scroll PRIMA
          this.smoothScrollTo(targetPosition, function() {

              self.focusElement(targetIndex);
          });
      } else {
          // Se stiamo andando all'header (non è una riga), scrolla a 0 e poi focus

// Metodo scrollToRow
TizenNavigation.prototype.scrollToRow = function(element) {
  var now = Date.now();
  if (now - this.lastScrollTime < this.scrollDuration) return;
  this.lastScrollTime = now;

  var navbar = document.querySelector('.navbar');
  var navbarHeight = navbar ? navbar.offsetHeight : 0;

  if (!target) return;

  var targetRect = target.getBoundingClientRect();
  var currentScroll = window.pageYOffset;
  
  // Calcola quanto della riga è già visibile
  var visibleTop = Math.max(0, targetRect.top);
  var visibleBottom = Math.min(window.innerHeight, targetRect.bottom);
  var visibleHeight = visibleBottom - visibleTop;
  
  // Se meno del 60% della riga è visibile, scrolla
  if (visibleHeight < targetRect.height * 0.6) {
    var targetPosition = targetRect.top + currentScroll;
    var offsetPosition = targetPosition - navbarHeight - 20; // 20px di margine
    
    this.smoothScrollTo(offsetPosition);
  }
};

// Aggiungi questo metodo per gestire meglio la navigazione orizzontale:
TizenNavigation.prototype.scrollIntoViewForTizen = function(element) {
  var row = element.closest('.row');
  if (!row) return;

  var rowRect = row.getBoundingClientRect();
  var elementRect = element.getBoundingClientRect();
  var rowScrollLeft = row.scrollLeft;
  var rowWidth = row.clientWidth;
  
  // Calcola la posizione desiderata
  var elementLeft = elementRect.left - rowRect.left + rowScrollLeft;
  var elementRight = elementRect.right - rowRect.left + rowScrollLeft;
  
  // Se l'elemento è già completamente visibile, non scrollare
  if (elementLeft >= rowScrollLeft && elementRight <= rowScrollLeft + rowWidth) {
    return;
  }
  
  var targetPosition = elementLeft - (rowWidth / 2) + (elementRect.width / 2);
  
  // Applica lo scroll con animazione
  row.scrollTo({
    left: targetPosition,
    behavior: 'smooth'
  });
};

// Metodo smoothScrollTo
TizenNavigation.prototype.smoothScrollTo = function(targetPosition) {
    var startPosition = window.pageYOffset;
    var distance = targetPosition - startPosition;
    
    // Se la distanza è piccola, non animare
    if (Math.abs(distance) < 5) {
        window.scrollTo(0, targetPosition);
        return;
    }

    var startTime = performance.now();
    var duration = Math.min(Math.abs(distance) * 0.5, 100); // Durata massima 800ms

    var easeOutCubic = function(t) { return (--t) * t * t + 1; }; // Curva di easing più morbida
    var self = this;

    var animationFrame = function(currentTime) {
        var elapsed = currentTime - startTime;
        var progress = Math.min(elapsed / duration, 1);
        var easedProgress = easeOutCubic(progress);
        
        window.scrollTo(0, startPosition + distance * easedProgress);
        
        if (progress < 1) {
            requestAnimationFrame(animationFrame);
        }
    };

    requestAnimationFrame(animationFrame);
};

// Metodo navigateDown aggiornato
TizenNavigation.prototype.navigateDown = function() {
  var current = this.focusableElements[this.currentIndex];
  if (!current) return;

  // --- FIX: NAVIGAZIONE ISTANTANEA PER PAGINA DETTAGLI ---
    if (this.isInDetailsPage()) {
        var currentRect = current.getBoundingClientRect();
        var bestMatch = -1;

            // Deve essere SOTTO
            if (rect.top >= currentRect.bottom - 10) { 
                var dx = (currentRect.left + currentRect.width/2) - (rect.left + rect.width/2);
                var dy = rect.top - currentRect.bottom;
                // Privilegia l'allineamento verticale (dx * 2)
                var dist = Math.sqrt((dx*2)*(dx*2) + dy*dy);

                if (dist < bestDistance) {
                    bestDistance = dist;
                    bestMatch = i;
                }
            }
        }

        if (bestMatch !== -1) {
            this.focusElement(bestMatch);
            // Scroll semplice per mantenere visibile
            var targetEl = this.focusableElements[bestMatch];
            try { targetEl.scrollIntoView({block: "center", behavior: "smooth"}); } catch(e){}
        }
        return;
    }

  // --- FIX NAVIGAZIONE: Da Ricerche Recenti a Contenuti ---
  // Se siamo in un chip delle ricerche recenti, forza la navigazione alla prima sezione disponibile
  if (current.closest('#recent-searches-container')) {
      
      // 1. Prova a selezionare "Continua a guardare" se visibile
      var continueSection = document.getElementById('continue-watching');
      if (continueSection && continueSection.style.display !== 'none') {
          var firstItem = continueSection.querySelector('.focusable');
          // Se troviamo un elemento e appartiene alla nostra lista focusable
          if (firstItem) {
              var idx = this.focusableElements.indexOf(firstItem);
              if (idx !== -1) {
                  this.scrollToRow(firstItem);
                  this.focusElement(idx);
                  return;
              }
          }
      }

      // 2. Se "Continua a guardare" non c'è/vuoto, cerca la prima riga di contenuti visibile (es. Trending)
      // Selezioniamo tutti i container delle righe che non sono la ricerca o le ricerche recenti
      var contentRows = document.querySelectorAll('.rows-container');
      for (var k = 0; k < contentRows.length; k++) {
          var row = contentRows[k];
          // Ignora se è nascosta o se è la sezione search-results (se gestita separatamente)
          if (row.style.display !== 'none' && row.id !== 'search-results') {
              var targetItem = row.querySelector('.focusable');
              if (targetItem) {
                  var targetIdx = this.focusableElements.indexOf(targetItem);
                  if (targetIdx !== -1) {
                      this.scrollToRow(targetItem);
                      this.focusElement(targetIdx);
                      return;
                  }
              }
          }
      }
  }
  // ---------------------------------------------------------

  var currentRect = current.getBoundingClientRect();
  var bestMatch = null;
  var bestDistance = Infinity;
  var self = this;

  // Logica standard geometrica (inalterata per il resto dell'app)
  for (var i = 0; i < this.focusableElements.length; i++) {
    var element = this.focusableElements[i];
    if (i === this.currentIndex) continue;
    
    var rect = element.getBoundingClientRect();
    
    // Cerca elementi che sono sotto l'elemento corrente
    if (rect.top >= currentRect.bottom - 20) { // Tolleranza aumentata a 20px
      // Calcolo distanza ponderata: privilegia l'allineamento verticale (X) rispetto alla distanza verticale (Y)
      // Questo aiuta a selezionare l'elemento "direttamente sotto" visivamente
      var distY = rect.top - currentRect.bottom;
      var distX = Math.abs((rect.left + rect.width / 2) - (currentRect.left + currentRect.width / 2));
      
      // Peso maggiore alla distanza X per evitare salti diagonali eccessivi
      var totalDist = Math.sqrt((distX * distX) + (distY * distY * 4)); 

      if (totalDist < bestDistance) {
        bestDistance = totalDist;
        bestMatch = i;
      }
    }
  }

  if (bestMatch !== null) {
    var targetElement = this.focusableElements[bestMatch];
    var targetRow = targetElement.closest('.rows-container');
    
    if (targetRow) {
      // Calcolo scroll per centrare o mostrare bene la riga
      var navbar = document.querySelector('.navbar');
      var navbarHeight = navbar ? navbar.offsetHeight : 0;
      var targetPosition = targetRow.getBoundingClientRect().top + window.pageYOffset;
      var offsetPosition = targetPosition - navbarHeight - 20; 
      
      this.smoothScrollTo(offsetPosition, function() {
        self.focusElement(bestMatch);
      });
    } else {
      this.focusElement(bestMatch);
    }
  } else if (this.currentIndex < this.focusableElements.length - 1) {
    // Fallback: se non trovi nulla sotto geometricamente, vai al prossimo elemento nel DOM
    // Utile per liste verticali non standard
    this.focusElement(this.currentIndex + 1);
  }
};

// Metodo scrollRowIntoView
TizenNavigation.prototype.scrollRowIntoView = function(element) {
    if (this.isScrolling) return;
    this.isScrolling = true;

    var rowContainer = element.closest('.rows-container');
    if (!rowContainer) {
        this.isScrolling = false;
        return;
    }

    var containerTop = rowContainer.getBoundingClientRect().top;
    var navbar = document.querySelector('.navbar');
    var navbarHeight = navbar ? navbar.offsetHeight : 0;
    var offset = navbarHeight + 20; // 20px di margine

    // Calcola la posizione di scroll
    var targetPosition = rowContainer.offsetTop - offset;

    // Scroll fluido
    window.scrollTo({
        top: targetPosition,
        behavior: 'smooth'
    });

    // Fallback per browser senza supporto a scroll-behavior
    if (!('scrollBehavior' in document.documentElement.style)) {
        var start = window.pageYOffset;
        var change = targetPosition - start;
        var startTime = performance.now();
        var duration = 300;
        var self = this;

        var animateScroll = function(currentTime) {
            var elapsed = currentTime - startTime;
            var progress = Math.min(elapsed / duration, 1);
            window.scrollTo(0, start + change * progress);
            
            if (progress < 1) {
                requestAnimationFrame(animateScroll);
            } else {
                self.isScrolling = false;
            }
        };
        
        requestAnimationFrame(animateScroll);
    } else {
        var self = this;
        setTimeout(function() {
            self.isScrolling = false;
        }, 300);
    }
};

// Metodo activateCurrentElement
TizenNavigation.prototype.activateCurrentElement = function() {
    var current = this.focusableElements[this.currentIndex];
    if (current) {
        // console.log('🔥 Attivazione elemento:', current);
        
        // Gestisci elementi nei modali
        if (current.closest('.episode-selection-view')) {
            // Simula click con diversi metodi per compatibilità Tizen
            var event = new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            });
            current.dispatchEvent(event);
            
            // Fallback se onclick è definito
            if (current.onclick) {
                current.onclick();
            }
            return;
        }
        
        // Comportamento normale per altri elementi
        if (current.click) {
            current.click();
        } else if (current.onclick) {
            current.onclick();
        } else {
            var event = new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            });
            current.dispatchEvent(event);
        }
    }
};

    var searchResults = document.getElementById("search-results");

        this.refreshFocusableElements();
        this.focusElement(0);
        return;
    }
    
    if (searchResults.style.display === 'block') {
        goToHome();
        return;
    }

    // --- GESTIONE STACK (FIX TIMING) ---
    var top = this.peekState();
    if (top) {
        if (typeof top.onClose === 'function') {
            top.onClose(); // Avvia animazione chiusura (dura 300ms)
        } else if (top.type === 'modal') {
             closeModalUI(); 
        }

        this.popState();
        
        var self = this;
        
        // Timeout aumentato a 350ms (era 100ms)
        // Deve essere MAGGIORE della durata dell'animazione CSS (300ms)
        // per garantire che la pagina sotto sia visibile e scrollata correttamente
        setTimeout(function() {
            self.refreshFocusableElements();
            
            // Ripristina il focus sull'elemento precedente
            if (top.previousElement && document.body.contains(top.previousElement)) {
                var idx = self.focusableElements.indexOf(top.previousElement);
                if (idx !== -1) {
                    self.focusElement(idx);
                } else {
                    self.focusFirstElement();
                }
            } else {
                self.focusFirstElement();
            }
        }, 350); 
        
        return;
    }

    goToHome();
};

                    }
                }
            }
            
            self.focusElement(newIndex);

    // Main search function
async function searchMedia() {
    var query = document.getElementById("search-input").value.trim();
    var resultsContainer = document.getElementById("results-container");
    var trendingContainer = document.getElementById("trending-container");
    var searchResults = document.getElementById("search-results");
    var recentWrapper = document.getElementById("recent-searches-wrapper"); 
    
    // Nascondi tutte le sezioni tranne i risultati della ricerca
    var allSections = document.querySelectorAll('.rows-container');
    for (var i = 0; i < allSections.length; i++) {
        // Escludi la sezione "Continua a guardare" e i risultati della ricerca
        if ( allSections[i].id !== 'search-results') {
            allSections[i].style.display = 'none';
        }
    }

    if (!query) {
        // Se la query è vuota, mostra di nuovo tutte le sezioni
        for (var j = 0; j < allSections.length; j++) {
            if (allSections[j].id !== 'search-results') {
                allSections[j].style.display = 'block';
            }
        }
        searchResults.style.display = 'none';
        if (navigation) navigation.updateAfterContentLoad();
        initRecentSearches();
        return;
    }
if (recentWrapper) recentWrapper.style.display = 'none';
    // Nascondi trending e mostra solo risultati
    trendingContainer.style.display = 'none';
    searchResults.style.display = 'block';
    document.getElementById("continue-watching").style.display = 'none';

    resultsContainer.innerHTML = `
        <div style="width:100%; text-align:center; padding:40px;">
            <i class="fas fa-spinner fa-spin"></i> Ricerca in corso...
        </div>
    `;
    
    if (navigation) navigation.updateAfterContentLoad();
    
    try {
        var searchResponse = await fetch(
            'https://api.themoviedb.org/3/search/multi?api_key=1e8c9083f94c62dd66fb2105cd7b613b&query=' + encodeURIComponent(query) + '&language=it-IT'
        );
        var searchData = await searchResponse.json();

        // Filtra solo i contenuti disponibili
        var allResults = (searchData.results || []).filter(function(item) {
            return availableContent.some(function(content) {
                return content.tmdb_id === item.id;
            }) && (item.media_type === 'movie' || item.media_type === 'tv');
        });

        if (allResults.length === 0) {
            resultsContainer.innerHTML = `
                <div style="width:100%; text-align:center; padding:40px;">
                    <i class="far fa-sad-tear"></i> Nessun risultato trovato
                </div>
            `;
            if (navigation) navigation.updateAfterContentLoad();
            return;
        }

        if (query.length >= 2) {
            saveSearchTerm(query);
        }

        resultsContainer.innerHTML = allResults.map(function(item) {
            var isTV = item.media_type === 'tv';
            var poster = item.poster_path 
                ? 'https://image.tmdb.org/t/p/w500' + item.poster_path
                : 'https://via.placeholder.com/500x750?text=No+poster';
            
            var year = isTV 
                ? (item.first_air_date ? item.first_air_date.substring(0, 4) : 'N/D')
                : (item.release_date ? item.release_date.substring(0, 4) : 'N/D');
            
            var title = isTV ? item.name : item.title;
            
            return `
                <div class="row-item focusable" tabindex="0" onclick="${isTV ? 'showTVSeasons' : 'watchMovie'}(${item.id}, '${isTV ? 'tv' : 'movie'}')">
                    <img src="${poster}" alt="${title}" loading="lazy">
                    <div class="row-item-info">
                        <h3 class="row-item-title">${title}</h3>
                        <div class="row-item-meta">
                            <span>${isTV ? 'Serie TV' : 'Film'}</span>
                            <span>${year}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // 🔥 Aggiorna navigazione anche in caso di errore
        if (navigation) {
            navigation.updateAfterContentLoad();
        }

    } catch (error) {
        console.error("Search error:", error);
        resultsContainer.innerHTML = `
            <div style="width:100%; text-align:center; padding:40px;">
                <i class="fas fa-exclamation-triangle"></i> Errore durante la ricerca
                <button onclick="searchMedia()" style="
                    margin-top: 15px;
                    background: var(--primary);
                    color: white;
                    border: none;
                    padding: 8px 15px;
                    border-radius: 5px;
                    cursor: pointer;
                ">
                    Riprova
                </button>
            </div>
        `;
    }
}

function generateEpisodesScreenshotStyle(tvId, seasonNum, episodes) {
    if (!episodes || episodes.length === 0) return '<div style="padding:20px; color:#666;">Nessun episodio.</div>';

    return episodes.map(function(ep) {
        var thumb = ep.still_path ? 'https://image.tmdb.org/t/p/w300' + ep.still_path : '';
        var imgHtml = thumb 
            ? '<img src="' + thumb + '" class="nfx-item-thumb" loading="lazy">'
            : '<div class="nfx-item-thumb" style="display:flex;align-items:center;justify-content:center;color:#555;"><i class="fas fa-film"></i></div>';

        return [
            '<div class="nfx-episode-item focusable" tabindex="0" ',
                 'onclick="initAndPlayTVEpisode(' + tvId + ', ' + seasonNum + ', ' + ep.episode_number + ')">',
                
                // 1. Numero
                '<div class="nfx-item-num">' + ep.episode_number + '</div>',
                
                // 2. Thumbnail
                imgHtml,
                
                // 3. Info
                '<div class="nfx-item-info">',

                        '<span class="nfx-item-title">' + (ep.name || 'Episodio ' + ep.episode_number) + '</span>',
                        '<span class="nfx-item-dur">' + (ep.runtime ? ep.runtime + 'm' : '') + '</span>',
                    '</div>',
                    '<div class="nfx-item-desc">' + (ep.overview || '') + '</div>',
                '</div>',

            '</div>'
        ].join('');
    }).join('');
}

                }
                html.push('</div>'); // end scroll

            html.push('</div>');
        }

    html.push('</div>'); // end container

    detailsPage.innerHTML = html.join('');

    if (navigation) {
        navigation.refreshFocusableElements();
        var playBtn = document.getElementById('btn-play-movie');
        if (playBtn) {
            setTimeout(function() { 
                var idx = navigation.focusableElements.indexOf(playBtn);
                if (idx !== -1) navigation.focusElement(idx);
            }, 100);
        }
    }
}

// 4. Funzione Helper per avviare il player film (che prima faceva watchMovie)
function initAndPlayMovie(movieId) {
    // Navigazione diretta al player
    window.location.href = 'player.html?movieId=' + movieId + '&type=movie';
}
/**
 * Chiude il player modale e gestisce la pulizia delle risorse (ES5-compatibile)
 */
function closePlayer() {
    var playerContainer = document.getElementById("player-container");
    if (!playerContainer) return;
    
    // 1. Chiudi il player video se aperto
    if (window.hls) {
        window.hls.destroy();
        window.hls = null;
    }
    
    var video = playerContainer.querySelector('video');
    if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
    }
    
    // 2. Pulisci i modali
    var episodeModal = document.getElementById("episodes-container");
    if (episodeModal && episodeModal.parentNode) {
        episodeModal.parentNode.removeChild(episodeModal);
    }
    
    var seasonsModal = document.getElementById("seasons-container");
    if (seasonsModal && seasonsModal.parentNode) {
        seasonsModal.parentNode.removeChild(seasonsModal);
    }
    
    // 3. Ripristina lo stato della pagina
    playerContainer.style.display = 'none';
    document.body.style.overflow = 'auto';
    
    // 4. Ripristino avanzato del focus
    var previousElement = null;
    
    // Prova a recuperare l'elemento direttamente
    if (playerContainer.dataset.previousElement) {
        previousElement = playerContainer.dataset.previousElement;
    } 
    // Fallback: recupera tramite ID
    else if (playerContainer.dataset.previousFocus) {
        previousElement = document.getElementById(playerContainer.dataset.previousFocus);
    }
    
    // Ripristina il focus se l'elemento esiste ancora nel DOM
    if (previousElement && document.body.contains(previousElement)) {
        try {
            previousElement.focus();
            // console.log('Focus ripristinato su:', previousElement);
        } catch (e) {
            console.warn('Impossibile ripristinare il focus:', e);
        }
    }
    
    // 5. Aggiorna la navigazione TV
    if (typeof navigation !== 'undefined' && navigation) {
        navigation.refreshFocusableElements();
        
        // Se non è stato possibile ripristinare il focus, fallback al primo elemento
        if (!previousElement || !document.body.contains(previousElement)) {
            navigation.focusElement(0);
        }
    }
}

// Avvia il timer per il trailer
function startTrailerSequence(videoId) {
    // Pulisci eventuali timer precedenti
    if (trailerTimeout) clearTimeout(trailerTimeout);

    // Aspetta 3.5 secondi prima di caricare il video
    trailerTimeout = setTimeout(function() {
        loadTrailerIframe(videoId);
    }, 200);
}

// Ferma il trailer (chiamata quando si esce)
function stopTrailer() {
    if (trailerTimeout) {
        clearTimeout(trailerTimeout);
        trailerTimeout = null;
    }
    
    var container = document.getElementById('hero-video-container');

// Listener per il tasto back/escape (ES5-compatibile)
document.addEventListener('DOMContentLoaded', function() {

    document.addEventListener('keydown', function(e) {
        var key = e.key || String.fromCharCode(e.keyCode);
        if (key === 'Backspace' || key === 'Escape' || e.keyCode === 27 || e.keyCode === 10009) {
            var playerContainer = document.getElementById("player-container");
            if (playerContainer && playerContainer.style.display === 'flex') {
                e.preventDefault();
                closePlayer();
            }
        }
    });
});
