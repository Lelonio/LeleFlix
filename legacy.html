<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1.0 maximum-scale=1.0  user-scalable=no" >
  <meta name="theme-color" content="#e50914">

  <title>LeleFlix</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5"></script>
<script src="https://luke-chang.github.io/js-spatial-navigation/spatial_navigation.js"></script>  

<style>

/* --- ANIMAZIONI PAGINA DETTAGLI --- */

/* Keyframes */
@keyframes pageFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUpFade {
    from { 
        opacity: 0; 
        transform: translateY(40px); 
    }
    to { 
        opacity: 1; 
        transform: translateY(0); 
    }
}

@keyframes backdropEntry {
    from { 
        opacity: 0; 
        transform: scale(1.1); 
    }
    to { 
        opacity: 0.6; /* Il valore finale che avevi nel CSS originale */
        transform: scale(1); 
    }
}

@keyframes fadeOutExit {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* Applicazione Animazioni all'apertura */

/* 1. Il contenitore principale appare dolcemente */
.details-page-view {
    animation: pageFadeIn 0.4s ease-out forwards;
}

/* 2. Lo sfondo fa un leggero zoom-out e fade-in */
.hero-backdrop {
    /* Sovrascriviamo l'opacity base per lasciarla gestire all'animazione */
    opacity: 0; 
    animation: backdropEntry 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* 3. La colonna sinistra (Info) entra dal basso con ritardo */
.details-left-col, .details-info-top {
    opacity: 0; /* Parte nascosto */
    animation: slideUpFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.2s; /* Aspetta un attimo */
}

/* 4. La colonna destra (Episodi/Simili) entra dopo la sinistra */
.details-right-col, .similar-section-bottom {
    opacity: 0; /* Parte nascosto */
    animation: slideUpFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.3s; /* Ritardo maggiore */
}

/* CLASSE PER L'USCITA (Gestita via JS) */
.details-page-view.closing-animation {
    animation: fadeOutExit 0.3s ease-out forwards !important;
    pointer-events: none; /* Evita click mentre chiude */
}

/* Contenitore principale flessibile in colonna */
.details-content.movie-layout {
    flex-direction: column;
    justify-content: flex-end; /* Spinge il contenuto verso il basso se c'è spazio */
    padding: 40px 60px;
}

/* Sezione Info (Alto) */
.details-info-top {
    width: 60%; /* Lascia spazio allo sfondo a destra */
    margin-bottom: auto; /* Spinge la sezione simili in fondo */
    padding-top: 40px;
}

/* Titoli Simili (Basso) */
.similar-section-bottom {
    width: 100%;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
}

.similar-section-title {
    font-size: 20px;
    color: #e5e5e5;
    margin-bottom: 15px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

.similar-row-scroll::-webkit-scrollbar { display: none; }

/* Card Orizzontale (Backdrop style) */
.similar-card-horizontal {
    flex: 0 0 auto;
    width: 260px;
    aspect-ratio: 16/9; /* Formato Orizzontale */
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    border: 3px solid transparent;
    transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    background: #222;
    cursor: pointer;
}

.similar-card-horizontal img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Overlay Titolo sulla card */
.similar-card-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 20px 10px 5px 10px;
    opacity: 0; /* Nascosto di default, appare al focus */
    transition: opacity 0.2s;
}

.similar-card-title {
    color: white;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Focus State */
.similar-card-horizontal:focus, .similar-card-horizontal.tv-focused {
    transform: scale(1.1);
    border-color: #e50914;
    z-index: 10;
    box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    outline: none;
}

.similar-card-horizontal:focus .similar-card-overlay,
.similar-card-horizontal.tv-focused .similar-card-overlay {
    opacity: 1;
}

  /* --- STILE RICERCHE RECENTI --- */
.recent-searches-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    width: 100%;
    /* Nascondiamo di default finché non c'è JS */
    display: none; 
}

.recent-searches-title {
    font-size: 16px;
    color: #8c8c8c;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.recent-chips-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    max-width: 900px;
}

.recent-chip {
    background: rgba(255,255,255,0.15);
    border: 2px solid transparent;
    border-radius: 50px;
    padding: 10px 25px;
    color: #e5e5e5;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    display: flex;
    align-items: center;
    gap: 10px;
}

.recent-chip i { font-size: 14px; opacity: 0.7; }

/* Focus / Hover */
.recent-chip:focus, .recent-chip.tv-focused {
    background: #e50914;
    color: white;
    border-color: white;
    transform: scale(1.1);
    outline: none;
    box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    z-index: 10;
}

.recent-chip.clear-btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid #444;
}
.recent-chip.clear-btn:focus, .recent-chip.clear-btn.tv-focused {
    background: #333;
    border-color: white;
    transform: scale(1.1);
}
  /* --- STILE PAGINA SERIE TV (NETFLIX STYLE) --- */

/* Contenitore Pagina Dettagli */
.details-page-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #141414;
    z-index: 5000;
    display: none; /* Nascosto di default */
    overflow: hidden;
}

/* Sfondo Hero (Immagine a tutto schermo) */
.hero-backdrop {
    position: absolute;
    top: 0;
    right: 0;
    width: 70%; /* Copre il 70% destro */
    height: 100%;
    background-size: cover;
    background-position: center top;
    z-index: 1;
    mask-image: linear-gradient(to right, transparent 0%, black 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 60%);
    opacity: 0.6;
}

/* Sfumatura sinistra per il testo */
.hero-vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, #141414 30%, rgba(20,20,20,0.8) 50%, transparent 100%);
    z-index: 2;
}

/* Contenuto Principale (Layout Flex) */
.details-content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    padding: 40px 60px;
}

/* Colonna Sinistra: Info */
.details-left-col {
    width: 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 40px;
}

.details-logo {
    max-width: 80%;
    max-height: 200px;
    object-fit: contain;
    object-position: left bottom;
    margin-bottom: 20px;
}

.details-title-text {
    font-size: 56px;
    font-weight: 800;
    margin-bottom: 10px;
    line-height: 1.1;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

.details-meta {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 18px;
    color: #bcbcbc;
    margin-bottom: 20px;
    font-weight: 600;
}

.match-score { color: #46d369; }

.details-overview {
    font-size: 20px;
    line-height: 1.5;
    color: #fff;
    margin-bottom: 30px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

.action-buttons {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.btn-hero {
    padding: 12px 30px;
    border-radius: 4px;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
}

.btn-play { background: #fff; color: #000; }
.btn-secondary { background: rgba(109, 109, 110, 0.7); color: #fff; }

.btn-hero:focus, .btn-hero.tv-focused {
    transform: scale(1.1);
    outline: 4px solid rgba(255,255,255,0.5);
    z-index: 20;
}

/* Colonna Destra: Episodi */
.details-right-col {
    width: 55%;
    display: flex;
    flex-direction: column;
    padding-top: 50px;
}

.season-selector {
    margin-bottom: 20px;
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding: 5px;
}

.season-btn {
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 20px;
    padding: 10px 20px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 3px solid transparent;
}

.season-btn.active { color: #fff; border-bottom-color: #e50914; }
.season-btn:focus, .season-btn.tv-focused { color: #fff; background: rgba(255,255,255,0.1); outline: none; }

.episodes-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 20px;
}

/* Card Episodio (Stile Lista) */
.episode-row {
    display: flex;
    align-items: center;
    padding: 20px;
    border-radius: 4px;
    margin-bottom: 10px;
    background: transparent;
    border: 1px solid transparent;
    transition: background 0.2s;
    cursor: pointer;
}

.episode-row:hover { background: rgba(255,255,255,0.1); }

.episode-row:focus, .episode-row.tv-focused {
    background: rgba(255,255,255,0.2);
    border-color: #fff;
    outline: none;
    transform: scale(1.01);
}

.ep-number { font-size: 24px; color: #aaa; width: 40px; text-align: center; margin-right: 15px; }
.ep-thumb { width: 140px; height: 80px; object-fit: cover; border-radius: 4px; margin-right: 20px; }
.ep-info { flex: 1; }
.ep-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
.ep-desc { font-size: 14px; color: #aaa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-duration { font-size: 14px; color: #fff; margin-left: 10px; white-space: nowrap; }
html {
    zoom: 130%;
    overflow: scroll;
    overflow-x: hidden;
}

/* Assicurati che questo sia presente e corretto */
.row-item {
    position: relative;
    z-index: 1;
    /* Transizione rapida per lo zoom, niente delay */
    transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
    /* Bordo trasparente iniziale per evitare scatti di layout */
    border: 3px solid transparent;
}

.row-item:focus, .row-item.tv-focused {
    /* Zoom leggermente ridotto se 1.15 era troppo, ma col padding 40px il 1.15 ci sta */
    transform: scale(1.15); 
    z-index: 1000; /* Deve essere altissimo */
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border-color: #fff;
    outline: none;
}


/* Ottimizza le transizioni */
.row-item,
.row-item-info,
.search-input {
    transition-duration: 0.3s;
    transition-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Disabilita le animazioni durante lo scroll per migliorare le performance */
.scrolling .row-item,
.scrolling .row-item-info {
    transition: none !important;
}

/* Ottimizza il rendering delle immagini */
.row-item img {
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    image-rendering: -webkit-optimize-contrast;
}
  /* Aggiungi questo al tuo CSS */
.rows-container {
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.rows-container.hidden {
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
}
/* Sostituisci tutto il CSS esistente per la griglia con: */
.episode-selection-view {
  width: 100%;
  padding: 20px;
}

.episodes-container-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
  width: 100%;
}

/* Forza il layout su Tizen TV */
@media (orientation: landscape) {
  .episodes-container-grid {
    grid-template-columns: repeat(4, minmax(250px, 1fr));
  }
}

/* Stile per le card degli episodi */
.episode-card {
  background: var(--gray);
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

.episode-card:hover {
  transform: scale(1.03);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.episode-card img {
  width: 100%;
  height: auto;
  aspect-ratio: 16/9;
  object-fit: cover;
}

.episode-info {
  padding: 1rem;
  flex-grow: 1;
}

.episode-info h3 {
  margin-bottom: 0.5rem;
  font-size: 1.1rem;
}

.episode-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--light-gray);
  margin-top: 0.5rem;
}

/* Placeholder per episodi senza immagine */
.episode-placeholder {
  background: var(--darker);
  aspect-ratio: 16/9;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--light-gray);
}
  /* Base Styles */
  :root {
    --primary: #e50914;
    --primary-dark: #b2070f;
    --dark: #141414;
    --darker: #0a0a0a;
    --gray: #222;
    --light-gray: #8c8c8c;
    --white: #fff;
    --transition: transform 0.3s ease;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: var(--darker);
    color: var(--white);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Navbar */
  .navbar {
    height: 80px;
    padding: 0 4%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(229, 9, 20, 0.75) 0%, rgba(10, 10, 10, 0) 64%);
  }

  .logo {
    cursor: pointer;
    transition: transform 0.3s ease;
    height: 45px;
    width: auto;
  }

  .logo:hover {
    transform: scale(1.05);
  }

  /* Main Content */
  .main-content {
    padding-top: 50px;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    position: relative;
    z-index: 1;
  }

  /* Search Section */
  .search-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 4%;
    text-align: center;
  }

  .search-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 1.5rem;
    line-height: 1.1;
  }

  .search-container {
    width: 100%;
    max-width: 600px;
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 15px 20px;
    font-size: 1.1rem;
    border: none;
    border-radius: 30px;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 5px 15px rgb(0, 0, 0);
    color: white;
    transition: var(--transition);
    backdrop-filter: blur(10px);
  }

  .search-input:focus {
    outline: none;
    background: rgba(255,255,255,0.2);
    box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
  }

  .search-button {
    position: absolute;
    right: 15px;
    top: 30%;
    background: transparent;
    border: none;
    color: var(--white);
    font-size: 1.2rem;
    cursor: pointer;
  }

  /* Rows Container */
  .rows-container {
    padding: 0 4%;
    margin-bottom: 3rem;
    scroll-margin-top: 100px;
    padding: 20px 0;
    padding-left: 50px;
  }

  .row-title {
    font-size: 1.4rem;
    margin-bottom: 1rem;
    margin-left: 50px;
    font-weight: 600;
    transition: transform 0.3s ease-out;
  }

  .rows-container:has(.row-item.tv-focused) .row-title {
    transform: translateX(10px);
    color: #e50914;
  }
/* --- FIX CLIPPING (TAGLIO CARD) --- */

.row {
    display: flex;
    overflow-x: auto;
    /* Aumentiamo drasticamente il padding verticale per ospitare lo zoom */
    padding: 40px 50px; 
    
    /* Usiamo margini negativi per compensare il padding visivamente */
    margin-top: -20px;
    margin-bottom: -20px;
    
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    
    /* Nascondi scrollbar */
    scrollbar-width: none;
}
.row::-webkit-scrollbar { display: none; }


/* Stessa logica per la riga dei film simili (nella pagina dettagli) */
.similar-row-scroll {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    /* Spazio per lo zoom (40px sopra e sotto) */
    padding: 40px 10px; 
    margin-top: -20px; /* Compensa spazio visivo */
    
    width: 100%;
    scrollbar-width: none; 
}
.similar-row-scroll::-webkit-scrollbar { display: none; }

  .row > * {
    margin-right: 30px;
  }

  .row::-webkit-scrollbar {
    display: none;
  }

  .row-item {
    flex: 0 0 auto;
    width: 16.666%;
    min-width: 200px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 2/3;
    scroll-snap-align: start;
  }

  .row-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s ease;
  }

  .row-item:hover img {
    opacity: 0.7;
  }

  .row-item-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
    padding: 1.5rem 1rem 1rem;
    opacity: 1;
  }

  @media (hover: hover) and (pointer: fine) {
    .row-item-info {
      opacity: 0;
      transition: var(--transition);
    }
    
    .row-item:hover .row-item-info,
    .row-item:focus .row-item-info,
    .row-item.tv-focused .row-item-info {
      opacity: 1;
    }
  }

  .row-item-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-item-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--light-gray);
  }

  /* Focus Styles */
  .focusable:focus,
  .row-item:focus {
    outline: none;
    transform: scale(1.05);
    box-shadow: 0 0 0 3px #e50914;
    z-index: 10;
    
    transition: transform 0.2s ease;
  }

  .row-item:focus img{
    opacity: 0.5;
  }

  .row-item.tv-focused {
    transform: scale(1.05);

    
    z-index: 10;
    box-shadow: 0 0 5px 3px #e50914, 0 0 20px rgba(229, 9, 20, 0.5);
  }

  .search-input:focus,
  .search-button:focus {
    border-color: #e50914;
    color: #e50914;
    outline: none;
  }

  /* Search Results */
  .search-results {
    display: none;
    padding: 0 4% 2rem;
  }

  .search-results.active {
    display: block;
  }

  .search-results .row-title {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
  }

  /* Player Container */
  .player-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
  }

  .close-player {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(20, 20, 20, 0.7);
    border: 2px solid rgba(255, 255, 255, 0.5);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1001;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .close-player:hover {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.1);
  }

  /* Episode Selection */
  .episode-selection-view {
    width: 90%;
    max-width: 1200px;
    height: 90vh;
    overflow-y: auto;
    padding: 2rem;
    background: var(--dark);
    border-radius: 8px;
  }

  .series-header {
    display: flex;
    margin-bottom: 30px;
    align-items: flex-start;
  }

  .series-header > *:not(:last-child) {
    margin-right: 20px;
  }

  .series-poster {
    width: 200px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }

  .series-info {
    flex: 1;
  }

  .series-overview {
    color: #aaa;
    margin-top: 10px;
    line-height: 1.5;
  }

  .seasons-title {
    margin: 20px 0;
    font-size: 1.5rem;

if (!('scrollBehavior' in document.documentElement.style)) {
  (function() {
    function smoothScrollPolyfill() {
      const originalScrollTo = Element.prototype.scrollTo;
      Element.prototype.scrollTo = function(options) {
        if (options && options.behavior === 'smooth') {
          const start = this.scrollLeft;
          const change = options.left - start;
          const startTime = performance.now();
          const duration = 300;

          const animateScroll = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            this.scrollLeft = start + change * progress;
            
            if (progress < 1) {
              requestAnimationFrame(animateScroll);
            }
          };
          
          requestAnimationFrame(animateScroll);
        } else {
          originalScrollTo.apply(this, arguments);
        }
      };
    }
    
    if (document.readyState === 'complete') {
      smoothScrollPolyfill();
    } else {
      window.addEventListener('load', smoothScrollPolyfill);
    }
  })();

/* --- LOGICA RICERCHE RECENTI (ES5) --- */

// Carica e renderizza le ricerche all'avvio
function initRecentSearches() {
    renderRecentSearches();
}

// Recupera array dal localStorage
function getRecentSearches() {
    try {
        var saved = localStorage.getItem('leleflix_recent_searches');
        return saved ? JSON.parse(saved) : [];
    } catch (e) { return []; }
}

// Salva una nuova ricerca
function saveSearchTerm(query) {
    if (!query || query.trim().length < 2) return; // Ignora ricerche troppo corte
    
    var searches = getRecentSearches();
    var term = query.trim();
    
    // Rimuovi se esiste già (per spostarlo in cima)
    var index = -1;
    for(var i=0; i<searches.length; i++) {
        if(searches[i].toLowerCase() === term.toLowerCase()) {
            index = i;
            break;
        }
    }
    if (index > -1) searches.splice(index, 1);
    
    // Aggiungi in testa
    searches.unshift(term);
    
    // Mantieni solo gli ultimi 8
    if (searches.length > 8) searches.pop();
    
    localStorage.setItem('leleflix_recent_searches', JSON.stringify(searches));
    renderRecentSearches();
}

// Renderizza i chip nell'HTML
function renderRecentSearches() {
    var wrapper = document.getElementById('recent-searches-wrapper');
    var container = document.getElementById('recent-searches-container');
    var searches = getRecentSearches();
    
    // Se non ci sono ricerche, nascondi la sezione
    if (searches.length === 0) {
        wrapper.style.display = 'none';
        return;
    }
    
    // Mostra la sezione
    wrapper.style.display = 'flex';
    
    var html = '';
    
    // Crea i chip per ogni ricerca
    for (var i = 0; i < searches.length; i++) {
        var term = searches[i];
        // Nota: escape degli apici per l'onclick
        var safeTerm = term.replace(/'/g, "\\'");
        
        html += '<div class="recent-chip focusable" tabindex="0" ' +
                'onclick="performSavedSearch(\'' + safeTerm + '\')">' +
                '<i class="fas fa-history"></i> ' + term +
                '</div>';
    }
    
    // Aggiungi pulsante "Pulisci" alla fine
    if (searches.length > 0) {
        html += '<div class="recent-chip clear-btn focusable" tabindex="0" ' +
                'onclick="clearRecentSearches()">' +
                '<i class="fas fa-trash-alt"></i> Pulisci' +
                '</div>';
    }
    
    container.innerHTML = html;
    
    // Aggiorna navigazione se disponibile
    if (typeof navigation !== 'undefined' && navigation) {
        navigation.refreshFocusableElements();
    }
}

// Funzione per visualizzare la sezione "Continua a guardare"
// Cache per i poster già recuperati
var posterCache = {};

// Funzione per ottenere i dettagli del poster da TMDB (ES5 compatibile)
function getPosterDetails(tmdbId, contentType, callback) {
  // Controlla se abbiamo già questo poster in cache
  var cacheKey = contentType + '-' + tmdbId;
  if (posterCache[cacheKey]) {
    callback(posterCache[cacheKey]);
    return;
  }
  
  var type = contentType === 'movie' ? 'movie' : 'tv';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.themoviedb.org/3/' + type + '/' + tmdbId + '?api_key=1e8c9083f94c62dd66fb2105cd7b613b&language=it-IT', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var posterPath = data.poster_path;
          
          // Salva in cache
          posterCache[cacheKey] = posterPath;
          
          callback(posterPath);
        } catch (e) {
          console.error('Error parsing poster data:', e);
          callback(null);
        }
      } else {
        console.error('Error fetching poster:', xhr.status);
        callback(null);
      }
    }
  };
  xhr.send();
}

// Polyfill per Promise se non supportato (per compatibilità con browser più vecchi)
if (typeof Promise === 'undefined') {
  (function() {
    function Promise(fn) {
      var state = 'pending';
      var value;
      var deferred = null;

      function resolve(newValue) {
        try {
          if (newValue && typeof newValue.then === 'function') {
            newValue.then(resolve, reject);
            return;
          }
          state = 'resolved';
          value = newValue;

          if (deferred) {
            handle(deferred);
          }
        } catch (e) {
          reject(e);
        }
      }

      function reject(reason) {
        state = 'rejected';
        value = reason;

        if (deferred) {
          handle(deferred);
        }
      }

      function handle(handler) {
        if (state === 'pending') {
          deferred = handler;
          return;
        }

        setTimeout(function() {
          var handlerCallback;

          if (state === 'resolved') {
            handlerCallback = handler.onResolved;
          } else {
            handlerCallback = handler.onRejected;
          }

          if (!handlerCallback) {
            if (state === 'resolved') {
              handler.resolve(value);
            } else {
              handler.reject(value);
            }
            return;
          }

          try {
            var ret = handlerCallback(value);
            handler.resolve(ret);
          } catch (e) {
            handler.reject(e);
          }
        }, 0);
      }

      this.then = function(onResolved, onRejected) {
        return new Promise(function(resolve, reject) {
          handle({
            onResolved: onResolved,
            onRejected: onRejected,
            resolve: resolve,
            reject: reject
          });
        });
      };

      fn(resolve, reject);
    }

    Promise.all = function(promises) {
      return new Promise(function(resolve, reject) {
        var results = [];
        var remaining = promises.length;

        if (remaining === 0) {
          resolve(results);
          return;
        }

        function res(i, val) {
          try {
            if (val && typeof val.then === 'function') {
              val.then(function(val) {
                res(i, val);
              }, reject);
              return;
            }
            results[i] = val;
            if (--remaining === 0) {
              resolve(results);
            }
          } catch (ex) {
            reject(ex);
          }
        }

        for (var i = 0; i < promises.length; i++) {
          res(i, promises[i]);
        }
      });
    };

    window.Promise = Promise;
  })();
}

function closeModalUI() {
    var playerContainer = document.getElementById("player-container");
    if (!playerContainer) return;

    // 1. Se per qualche motivo c'è un video aperto (es. se la modale è sovrapposta
    // a un player) lo puliamo, ma NON distruggiamo HLS se non serve:
    if (window.hls) {
        try {
            window.hls.destroy();
        } catch (e) {
            console.warn('Errore distruggendo hls in closeModalUI:', e);
        }
        window.hls = null;
    }
    var video = playerContainer.querySelector('video');
    if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
    }

    // 2. Nascondi / svuota la UI della modale
    playerContainer.innerHTML = '';
    playerContainer.style.display = 'none';

    // 3. Ripristina il focus precedente se presente
    var prevId = playerContainer.dataset.previousFocus;
    if (prevId) {
        var prevEl = document.getElementById(prevId);
        if (prevEl) {
            try {
                prevEl.focus();
                // console.log('Focus ripristinato su elemento precedente:', prevEl);
            } catch (e) {
                console.warn('Impossibile ripristinare il focus precedente:', e);
            }
        }
        delete playerContainer.dataset.previousFocus;
    }

    // 4. Aggiorna navigazione
    if (typeof navigation !== 'undefined' && navigation) {
        if (typeof navigation.refreshFocusableElements === 'function') {
            navigation.refreshFocusableElements();
        }
        // Fallback: se esiste helper per il primo elemento
        if (typeof navigation.focusFirstElement === 'function') {
            navigation.focusFirstElement();
        } else if (typeof navigation.focusElement === 'function') {
            // prova a rifocalizzare l'indice corrente (se valido)
            navigation.focusElement(navigation.currentIndex || 0);
        }
    }
}

// Sistema di navigazione ottimizzato specificamente per Tizen TV (versione ES5)
function TizenNavigation() {
    this.focusableElements = [];
    this.currentIndex = 0;
    this.isInitialized = false;
    this.isScrolling = false;
    this.lastScrollTime = 0;
    this.scrollDuration = 300;
    
    this.init();
    this.setupScrollHandlers();
    // Dentro il costruttore o come proprietà:
this.stateStack = [];

}

// Metodo init
TizenNavigation.prototype.init = function() {
    // Aspetta che il DOM sia completamente caricato
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', this.setup.bind(this));
    } else {
        this.setup();
    }
};

TizenNavigation.prototype.pushState = function(state) {
    this.stateStack.push(state);
};

TizenNavigation.prototype.popState = function() {
    return this.stateStack.pop();
};

TizenNavigation.prototype.peekState = function() {
    return this.stateStack[this.stateStack.length - 1];
};


// Metodo setup
TizenNavigation.prototype.setup = function() {
    // console.log('🔥 Inizializzando navigazione Tizen TV');
    
    // Gestisci eventi tastiera per navigazione con priorità alta
    document.addEventListener('keydown', this.handleKeyDown.bind(this), true);
    
    // Forza la disabilitazione della navigazione nativa Tizen
    this.disableTizenNativeNavigation();
    
    // Inizializza elementi focusable con delay per permettere il rendering
    var self = this;
    setTimeout(function() {
        self.refreshFocusableElements();
        self.focusFirstElement();
        self.isInitialized = true;
    }, 200);
};

// Metodo disableTizenNativeNavigation
TizenNavigation.prototype.disableTizenNativeNavigation = function() {
    // Disabilita la navigazione spaziale nativa di Tizen
    try {
        // Rimuovi attributi di navigazione spaziale nativi
        var elements = document.querySelectorAll('[spatial-navigation-action]');
        Array.prototype.forEach.call(elements, function(el) {
            el.removeAttribute('spatial-navigation-action');
        });
        
        // Disabilita focus automatico
        document.body.setAttribute('spatial-navigation', 'none');
        
        // console.log('✅ Navigazione nativa Tizen disabilitata');
    } catch (e) {
        console.warn('Impossibile disabilitare navigazione nativa:', e);
    }
};

// Metodo handleKeyDown
TizenNavigation.prototype.handleKeyDown = function(event) {
    if (!this.isInitialized) return;
    
    var keyCode = event.keyCode;
    
    // Intercetta TUTTI i tasti di navigazione prima che Tizen li gestisca
    if ([37, 38, 39, 40, 13, 27, 461, 10009].includes(keyCode)) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
    }

     console.log('🎮 Tasto premuto:', keyCode);

    switch(keyCode) {
        case 37: // Freccia sinistra
            this.navigateLeft();
            break;
        case 39: // Freccia destra  
            this.navigateRight();
            break;
        case 38: // Freccia su
            this.navigateUp();
            break;
        case 40: // Freccia giù
            this.navigateDown();
            break;
        case 13: // Tizen Enter
            this.activateCurrentElement();
            break;
        case 27: // Back
        case 10009: // Tizen Back
            this.handleBack();
            break;

    }
};

// Metodo refreshFocusableElements
TizenNavigation.prototype.refreshFocusableElements = function() {
    // Trova tutti gli elementi focusable visibili con controlli più rigidi
    var elements = document.querySelectorAll('.focusable');
    this.focusableElements = Array.prototype.filter.call(elements, function(el) {
        var rect = el.getBoundingClientRect();
        var style = window.getComputedStyle(el);
        
        return (
            rect.width > 0 && 
            rect.height > 0 && 
            style.display !== 'none' && 
            style.visibility !== 'hidden' &&
            el.offsetParent !== null
        );
    });
    
    // console.log('🎯 Elementi focusable trovati:', this.focusableElements.length, this.focusableElements);
    
    // Se l'indice corrente è fuori range, resettalo
    if (this.currentIndex >= this.focusableElements.length) {
        this.currentIndex = 0;
    }
};

// Metodo focusFirstElement
TizenNavigation.prototype.focusFirstElement = function() {
    if (this.focusableElements.length > 0) {
        this.focusElement(2);
        // console.log('👆 Focus iniziale impostato');
    }
};

// Metodo focusElement


// Metodo setupScrollHandlers
TizenNavigation.prototype.setupScrollHandlers = function() {
    var lastScrollPosition = 0;
    var self = this;
    
    window.addEventListener('scroll', function() {
        var currentScrollPosition = window.pageYOffset;
        var navbar = document.querySelector('.navbar');
        
        if (currentScrollPosition > lastScrollPosition && currentScrollPosition > 100) {
            // Scrolling down
            if (navbar) navbar.classList.add('hidden');
        } else {
            // Scrolling up
            if (navbar) navbar.classList.remove('hidden');
        }
        
        lastScrollPosition = currentScrollPosition;
    });
};

// Metodo scrollIntoViewForTizen
TizenNavigation.prototype.scrollIntoViewForTizen = function(element) {
    // Scroll ottimizzato per Tizen TV con animazione fluida
    var row = element.closest('.row');
    if (!row) return;

    var rowRect = row.getBoundingClientRect();
    var elementRect = element.getBoundingClientRect();
    var rowScrollLeft = row.scrollLeft;
    var rowWidth = row.clientWidth;
    
    // Calcola la posizione desiderata
    var elementLeft = elementRect.left - rowRect.left + rowScrollLeft;
    var elementRight = elementRect.right - rowRect.left + rowScrollLeft;
    var targetPosition = elementLeft - (rowWidth / 2) + (elementRect.width / 2);
    
    // Applica lo scroll con animazione
    row.scrollTo({
        left: targetPosition,
        behavior: 'smooth'
    });
    
    // Fallback per browser che non supportano scroll-behavior smooth
    if (!('scrollBehavior' in document.documentElement.style)) {
        var start = rowScrollLeft;
        var change = targetPosition - start;
        var startTime = performance.now();
        var duration = 300; // ms
        
        var self = this;
        var animateScroll = function(currentTime) {
            var elapsed = currentTime - startTime;
            var progress = Math.min(elapsed / duration, 1);
            row.scrollLeft = start + change * progress;
            
            if (progress < 1) {
                requestAnimationFrame(animateScroll);
            }
        };
        
        requestAnimationFrame(animateScroll);
    }
};

// Metodo navigateLeft
TizenNavigation.prototype.navigateLeft = function() {
    var current = this.focusableElements[this.currentIndex];
    if (!current) return;

    // console.log('⬅️ Navigazione sinistra');

    // Se siamo in una row, naviga nella stessa row
    if (current.closest('.row')) {
        var rowItems = Array.prototype.slice.call(current.closest('.row').querySelectorAll('.focusable'));
        var currentRowIndex = rowItems.indexOf(current);
        
        if (currentRowIndex > 0) {
            var newElement = rowItems[currentRowIndex - 1];
            var globalIndex = this.focusableElements.indexOf(newElement);
            if (globalIndex !== -1) {
                this.focusElement(globalIndex);
                return;
            }
        }
    }
    
    // Navigazione generale - vai al precedente
    if (this.currentIndex > 0) {
        this.focusElement(this.currentIndex - 1);
    }
};

// Metodo navigateRight
TizenNavigation.prototype.navigateRight = function() {
    var current = this.focusableElements[this.currentIndex];
    if (!current) return;

    // console.log('➡️ Navigazione destra');

    if (current.closest('.row')) {
        var rowItems = Array.prototype.slice.call(current.closest('.row').querySelectorAll('.focusable'));
        var currentRowIndex = rowItems.indexOf(current);
        
        if (currentRowIndex < rowItems.length - 1) {
            var newElement = rowItems[currentRowIndex + 1];
            var globalIndex = this.focusableElements.indexOf(newElement);
            if (globalIndex !== -1) {
                this.focusElement(globalIndex);
                return;
            }
        }
    }
    
    // Navigazione generale - vai al successivo
    if (this.currentIndex < this.focusableElements.length - 1) {
        this.focusElement(this.currentIndex + 1);
    }
};

// Metodo navigateUp
// Metodo navigateUp aggiornato per gestire Ricerche Recenti e Header
TizenNavigation.prototype.navigateUp = function() {
  var current = this.focusableElements[this.currentIndex];
  if (!current) return;

  // --- 1. Da Ricerche Recenti a Input Ricerca ---
  if (current.closest('#recent-searches-container')) {
      var searchInput = document.getElementById('search-input');
      if (searchInput) {
          // Scrolla in cima per vedere bene l'input
          window.scrollTo({ top: 0, behavior: 'smooth' });
          
          var idx = this.focusableElements.indexOf(searchInput);
          if (idx !== -1) {
              this.focusElement(idx);
              return;
          }
      }
  }

  // --- 2. Da Prima Riga Contenuti a Ricerche Recenti (o Input) ---
  // Verifica se siamo in un contenitore di righe o nei risultati
  var parentRow = current.closest('.rows-container, .search-results');
  if (parentRow) {
      // Identifica qual è la PRIMA riga visibile nella pagina
      var allContainers = document.querySelectorAll('.rows-container, .search-results');
      var firstVisible = null;
      
      for (var k = 0; k < allContainers.length; k++) {
          // Controlla che sia visibile (display non none e altezza > 0)
          if (allContainers[k].style.display !== 'none' && allContainers[k].offsetHeight > 0) {
              firstVisible = allContainers[k];
              break;
          }
      }

      // Se siamo effettivamente nella prima riga visibile
      if (parentRow === firstVisible) {
          
          // A. Prova ad andare alle Ricerche Recenti (se visibili)
          var recentWrapper = document.getElementById('recent-searches-wrapper');
          if (recentWrapper && recentWrapper.style.display !== 'none') {
              var chips = recentWrapper.querySelectorAll('.recent-chip');
              if (chips.length > 0) {
                  // Cerca il chip più vicino orizzontalmente per naturalezza
                  var currentRect = current.getBoundingClientRect();
                  var bestChipIdx = 0;
                  var minDist = Infinity;
                  
                  for(var c=0; c<chips.length; c++) {
                      var chipRect = chips[c].getBoundingClientRect();
                      // Distanza orizzontale tra i centri
                      var dist = Math.abs((chipRect.left + chipRect.width/2) - (currentRect.left + currentRect.width/2));
                      if (dist < minDist) {
                          minDist = dist;
                          bestChipIdx = c;
                      }
                  }
                  
                  var targetChip = chips[bestChipIdx];
                  var idx = this.focusableElements.indexOf(targetChip);
                  if (idx !== -1) {
                      this.smoothScrollTo(0); // Assicura che l'header sia visibile
                      this.focusElement(idx);
                      return;
                  }
              }
          }
          
          // B. Se non ci sono ricerche recenti, vai all'Input Ricerca
          var searchInput = document.getElementById('search-input');
          if (searchInput) {
              window.scrollTo({ top: 0, behavior: 'smooth' });
              var inputIdx = this.focusableElements.indexOf(searchInput);
              if (inputIdx !== -1) {
                  this.focusElement(inputIdx);
                  return;
              }
          }
      }
  }
  // ---------------------------------------------------------

  // --- 3. Logica Geometrica Standard (Fallback) ---
  // Se siamo già in cima alla pagina e non c'è niente sopra
  if (window.pageYOffset <= 0) {
    var elementsAbove = this.focusableElements.filter(function(el, i) {
      return i < this.currentIndex && 
             el.getBoundingClientRect().bottom <= current.getBoundingClientRect().top;
    }.bind(this));
    
    if (elementsAbove.length === 0) {
      return; 
    }
  }

  var currentRect = current.getBoundingClientRect();
  var bestMatch = null;
  var bestDistance = Infinity;
  var self = this;

  // Cerca elementi sopra quello corrente
  for (var i = 0; i < this.focusableElements.length; i++) {
    var element = this.focusableElements[i];
    if (i === this.currentIndex) continue;
    
    var rect = element.getBoundingClientRect();
    
    // Check geometrico standard
    if (rect.bottom <= currentRect.top + 20) { // Tolleranza 20px
      var distance = Math.abs(rect.left - currentRect.left) + (currentRect.top - rect.bottom);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestMatch = i;
      }
    }
  }

  if (bestMatch !== null) {
    var targetElement = this.focusableElements[bestMatch];
    var targetRow = targetElement.closest('.rows-container');
    
    if (targetRow) {
      // Gestione scroll per elementi sopra
      var navbar = document.querySelector('.navbar');
      var navbarHeight = navbar ? navbar.offsetHeight : 0;
      var targetPosition = targetRow.getBoundingClientRect().top + window.pageYOffset;
      var offsetPosition = targetPosition - navbarHeight - 20; 
      
      this.smoothScrollTo(offsetPosition, function() {
        self.focusElement(bestMatch);
      });
    } else {
      this.focusElement(bestMatch);
    }
  } else {
    // Se non trovi nulla geometricamente e siamo in alto, scrolla a 0
    if (this.currentIndex > 0 && window.pageYOffset > 0) {
      this.smoothScrollTo(0, function() {
        // Opzionale: focus sul primo elemento (spesso il logo o l'input)
        // self.focusElement(0); 
      });
    }
  }
};


// Metodo scrollToRow
TizenNavigation.prototype.scrollToRow = function(element) {
  var now = Date.now();
  if (now - this.lastScrollTime < this.scrollDuration) return;
  this.lastScrollTime = now;

  var navbar = document.querySelector('.navbar');
  var navbarHeight = navbar ? navbar.offsetHeight : 0;
  var target = element.closest('.rows-container');
  
  if (!target) return;

  var targetRect = target.getBoundingClientRect();
  var currentScroll = window.pageYOffset;
  
  // Calcola quanto della riga è già visibile
  var visibleTop = Math.max(0, targetRect.top);
  var visibleBottom = Math.min(window.innerHeight, targetRect.bottom);
  var visibleHeight = visibleBottom - visibleTop;
  
  // Se meno del 60% della riga è visibile, scrolla
  if (visibleHeight < targetRect.height * 0.6) {
    var targetPosition = targetRect.top + currentScroll;
    var offsetPosition = targetPosition - navbarHeight - 20; // 20px di margine
    
    this.smoothScrollTo(offsetPosition);
  }
};

// Aggiungi questo metodo per gestire meglio la navigazione orizzontale:
TizenNavigation.prototype.scrollIntoViewForTizen = function(element) {

  var rowRect = row.getBoundingClientRect();
  var elementRect = element.getBoundingClientRect();

  var rowWidth = row.clientWidth;
  
  // Calcola la posizione desiderata
  var elementLeft = elementRect.left - rowRect.left + rowScrollLeft;
  var elementRight = elementRect.right - rowRect.left + rowScrollLeft;
  
  // Se l'elemento è già completamente visibile, non scrollare
  if (elementLeft >= rowScrollLeft && elementRight <= rowScrollLeft + rowWidth) {
    return;
  }
  
  var targetPosition = elementLeft - (rowWidth / 2) + (elementRect.width / 2);
  
  // Applica lo scroll con animazione
  row.scrollTo({
    left: targetPosition,
    behavior: 'smooth'
  });
};

// Metodo smoothScrollTo
TizenNavigation.prototype.smoothScrollTo = function(targetPosition) {
    var startPosition = window.pageYOffset;
    var distance = targetPosition - startPosition;
    
    // Se la distanza è piccola, non animare
    if (Math.abs(distance) < 5) {
        window.scrollTo(0, targetPosition);
        return;
    }

    var startTime = performance.now();
    var duration = Math.min(Math.abs(distance) * 0.5, 100); // Durata massima 800ms

    var easeOutCubic = function(t) { return (--t) * t * t + 1; }; // Curva di easing più morbida
    var self = this;

    var animationFrame = function(currentTime) {
        var elapsed = currentTime - startTime;
        var progress = Math.min(elapsed / duration, 1);
        var easedProgress = easeOutCubic(progress);
        
        window.scrollTo(0, startPosition + distance * easedProgress);
        
        if (progress < 1) {
            requestAnimationFrame(animationFrame);
        }
    };

    requestAnimationFrame(animationFrame);
};

// Metodo navigateDown
// Metodo navigateDown aggiornato
TizenNavigation.prototype.navigateDown = function() {
  var current = this.focusableElements[this.currentIndex];
  if (!current) return;

  // --- FIX NAVIGAZIONE: Da Ricerche Recenti a Contenuti ---
  // Se siamo in un chip delle ricerche recenti, forza la navigazione alla prima sezione disponibile
  if (current.closest('#recent-searches-container')) {
      
      // 1. Prova a selezionare "Continua a guardare" se visibile
      var continueSection = document.getElementById('continue-watching');
      if (continueSection && continueSection.style.display !== 'none') {
          var firstItem = continueSection.querySelector('.focusable');
          // Se troviamo un elemento e appartiene alla nostra lista focusable
          if (firstItem) {
              var idx = this.focusableElements.indexOf(firstItem);
              if (idx !== -1) {
                  this.scrollToRow(firstItem);
                  this.focusElement(idx);
                  return;
              }
          }
      }

      // 2. Se "Continua a guardare" non c'è/vuoto, cerca la prima riga di contenuti visibile (es. Trending)
      // Selezioniamo tutti i container delle righe che non sono la ricerca o le ricerche recenti
      var contentRows = document.querySelectorAll('.rows-container');
      for (var k = 0; k < contentRows.length; k++) {
          var row = contentRows[k];
          // Ignora se è nascosta o se è la sezione search-results (se gestita separatamente)
          if (row.style.display !== 'none' && row.id !== 'search-results') {
              var targetItem = row.querySelector('.focusable');
              if (targetItem) {
                  var targetIdx = this.focusableElements.indexOf(targetItem);
                  if (targetIdx !== -1) {
                      this.scrollToRow(targetItem);
                      this.focusElement(targetIdx);
                      return;
                  }
              }
          }
      }
  }
  // ---------------------------------------------------------

  var currentRect = current.getBoundingClientRect();
  var bestMatch = null;
  var bestDistance = Infinity;
  var self = this;

  // Logica standard geometrica (inalterata per il resto dell'app)
  for (var i = 0; i < this.focusableElements.length; i++) {
    var element = this.focusableElements[i];
    if (i === this.currentIndex) continue;
    
    var rect = element.getBoundingClientRect();
    
    // Cerca elementi che sono sotto l'elemento corrente
    if (rect.top >= currentRect.bottom - 20) { // Tolleranza aumentata a 20px
      // Calcolo distanza ponderata: privilegia l'allineamento verticale (X) rispetto alla distanza verticale (Y)
      // Questo aiuta a selezionare l'elemento "direttamente sotto" visivamente
      var distY = rect.top - currentRect.bottom;
      var distX = Math.abs((rect.left + rect.width / 2) - (currentRect.left + currentRect.width / 2));
      
      // Peso maggiore alla distanza X per evitare salti diagonali eccessivi
      var totalDist = Math.sqrt((distX * distX) + (distY * distY * 4)); 

      if (totalDist < bestDistance) {
        bestDistance = totalDist;
        bestMatch = i;
      }
    }
  }

  if (bestMatch !== null) {
    var targetElement = this.focusableElements[bestMatch];
    var targetRow = targetElement.closest('.rows-container');
    
    if (targetRow) {
      // Calcolo scroll per centrare o mostrare bene la riga
      var navbar = document.querySelector('.navbar');
      var navbarHeight = navbar ? navbar.offsetHeight : 0;
      var targetPosition = targetRow.getBoundingClientRect().top + window.pageYOffset;
      var offsetPosition = targetPosition - navbarHeight - 20; 
      
      this.smoothScrollTo(offsetPosition, function() {
        self.focusElement(bestMatch);
      });
    } else {
      this.focusElement(bestMatch);
    }
  } else if (this.currentIndex < this.focusableElements.length - 1) {
    // Fallback: se non trovi nulla sotto geometricamente, vai al prossimo elemento nel DOM
    // Utile per liste verticali non standard
    this.focusElement(this.currentIndex + 1);
  }
};

// Metodo scrollRowIntoView
TizenNavigation.prototype.scrollRowIntoView = function(element) {
    if (this.isScrolling) return;
    this.isScrolling = true;

    var rowContainer = element.closest('.rows-container');
    if (!rowContainer) {
        this.isScrolling = false;
        return;
    }

    var containerTop = rowContainer.getBoundingClientRect().top;
    var navbar = document.querySelector('.navbar');
    var navbarHeight = navbar ? navbar.offsetHeight : 0;
    var offset = navbarHeight + 20; // 20px di margine

    // Calcola la posizione di scroll
    var targetPosition = rowContainer.offsetTop - offset;

    // Scroll fluido
    window.scrollTo({
        top: targetPosition,
        behavior: 'smooth'
    });

    // Fallback per browser senza supporto a scroll-behavior
    if (!('scrollBehavior' in document.documentElement.style)) {
        var start = window.pageYOffset;
        var change = targetPosition - start;
        var startTime = performance.now();
        var duration = 300;
        var self = this;

        var animateScroll = function(currentTime) {
            var elapsed = currentTime - startTime;
            var progress = Math.min(elapsed / duration, 1);
            window.scrollTo(0, start + change * progress);
            
            if (progress < 1) {
                requestAnimationFrame(animateScroll);
            } else {
                self.isScrolling = false;
            }
        };
        
        requestAnimationFrame(animateScroll);
    } else {
        var self = this;
        setTimeout(function() {
            self.isScrolling = false;
        }, 300);
    }
};

// Metodo activateCurrentElement
TizenNavigation.prototype.activateCurrentElement = function() {
    var current = this.focusableElements[this.currentIndex];
    if (current) {
        // console.log('🔥 Attivazione elemento:', current);
        
        // Gestisci elementi nei modali
        if (current.closest('.episode-selection-view')) {
            // Simula click con diversi metodi per compatibilità Tizen
            var event = new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            });
            current.dispatchEvent(event);
            
            // Fallback se onclick è definito
            if (current.onclick) {
                current.onclick();
            }
            return;
        }
        
        // Comportamento normale per altri elementi
        if (current.click) {
            current.click();
        } else if (current.onclick) {
            current.onclick();
        } else {
            var event = new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            });
            current.dispatchEvent(event);
        }
    }
};

TizenNavigation.prototype.handleBack = function() {

    var searchInput = document.getElementById("search-input");

        // Mostra tutte le sezioni nascoste

        for (var i = 0; i < allSections.length; i++) {
            if (allSections[i].id !== 'search-results') {
                allSections[i].style.display = 'block';
            }
        }
        
        // Aggiorna la navigazione
        this.refreshFocusableElements();
        this.focusElement(0);
        return;
    }
    
    // Se ci sono risultati di ricerca visibili, torna alla home
    if (searchResults.style.display === 'block') {
        searchResults.style.display = 'none';
        
        // Mostra tutte le sezioni nascoste
        var allSections = document.querySelectorAll('.rows-container');
        for (var j = 0; j < allSections.length; j++) {
            if (allSections[j].id !== 'search-results') {
                allSections[j].style.display = 'block';
            }
        }
        
        // Aggiorna la navigazione
        this.refreshFocusableElements();
        this.focusElement(0);
        return;
    }

// --- NUOVA GESTIONE STACK ---
    var top = this.peekState();
    if (top) {
        // Se lo stato ha una funzione di chiusura personalizzata (come la nostra pagina serie)
        if (typeof top.onClose === 'function') {
            top.onClose(); // Chiama closeSeriesPage()
        } else if (top.type === 'modal') {
             closeModalUI(); // Fallback per vecchi modali se ne usi ancora
        }

        // Rimuovi dallo stack
        this.popState();
        
        // Ripristina focus
        var self = this;
        setTimeout(function() {
            self.refreshFocusableElements();
            if (top.previousElement && document.body.contains(top.previousElement)) {
                // Trova l'indice del vecchio elemento
                var idx = self.focusableElements.indexOf(top.previousElement);
                if (idx !== -1) self.focusElement(idx);
                else self.focusFirstElement();
            } else {
                self.focusFirstElement();
            }
        }, 100);
        
        return;
    }



    
    // Se non c'è nient'altro da fare, torna alla home
    goToHome();
};

TizenNavigation.prototype.setupModalNavigation = function() {

    // Trova tutti gli elementi focusable nel modal
    var modalElements = playerContainer.querySelectorAll('.episode-card, .close-player');

        var style = window.getComputedStyle(el);
        return style.display !== 'none' && style.visibility !== 'hidden';
    });
    
    if (modalFocusable.length > 0) {
        // Combina con gli elementi esistenti
        this.focusableElements = modalFocusable;
        this.currentIndex = 0;
        this.focusElement(0);
    }

// Metodo updateAfterContentLoad
TizenNavigation.prototype.updateAfterContentLoad = function() {
    // console.log('🔄 Aggiornamento dopo caricamento contenuto dinamico');
    var self = this;
    
    // Aspetta che il rendering sia completato
    setTimeout(function() {
        var previousElement = self.focusableElements[self.currentIndex];
        self.refreshFocusableElements();
        
        // Se avevamo un elemento in focus, prova a mantenerlo o vai al primo disponibile
        if (self.focusableElements.length > 0) {
            var newIndex = 0;
            
            // Cerca di mantenere l'elemento precedentemente in focus
            if (previousElement) {
                var foundIndex = self.focusableElements.indexOf(previousElement);
                if (foundIndex !== -1) {
                    newIndex = foundIndex;
                } else {
                    // Se l'elemento precedente non esiste più, cerca il primo nella stessa sezione
                    var firstRowItem = document.querySelector('.row .focusable');
                    if (firstRowItem) {
                        var firstRowIndex = self.focusableElements.indexOf(firstRowItem);
                        if (firstRowIndex !== -1) {
                            newIndex = firstRowIndex;
                        }
                    }
                }
            }
            
            self.focusElement(newIndex);
        }
    }, 1000);
};

async function searchMedia() {

            allSections[i].style.display = 'none';
        }
    }

    if (!query) {
        // Se la query è vuota, mostra di nuovo tutte le sezioni
        for (var j = 0; j < allSections.length; j++) {

if (recentWrapper) recentWrapper.style.display = 'none';

            <i class="fas fa-spinner fa-spin"></i> Ricerca in corso...
        </div>
    `;
    
    if (navigation) navigation.updateAfterContentLoad();
    
    try {
        var searchResponse = await fetch(
            'https://api.themoviedb.org/3/search/multi?api_key=1e8c9083f94c62dd66fb2105cd7b613b&query=' + encodeURIComponent(query) + '&language=it-IT'
        );
        var searchData = await searchResponse.json();

        // Filtra solo i contenuti disponibili
        var allResults = (searchData.results || []).filter(function(item) {

        }).join('');

        // 🔥 Aggiorna navigazione anche in caso di errore
        if (navigation) {

    } catch (error) {

// Funzione helper per caricare dinamicamente altre stagioni
function loadSeasonEpisodes(tvId, seasonNum, btnElement) {

// Genera HTML per la lista episodi
function generateEpisodesHTML(tvId, seasonNum, episodes) {
    if (!episodes || episodes.length === 0) return 'Nessun episodio trovato.';

    return episodes.map(function(ep) {
        var thumb = ep.still_path ? 'https://image.tmdb.org/t/p/w300' + ep.still_path : '';
        // Fallback immagine
        var imgHtml = thumb 
            ? '<img src="' + thumb + '" class="ep-thumb" loading="lazy">' 
            : '<div class="ep-thumb" style="background:#333; display:flex; align-items:center; justify-content:center;"><i class="fas fa-play"></i></div>';

        return [
            '<div class="episode-row focusable" tabindex="0" ',
                'onclick="initAndPlayTVEpisode(' + tvId + ', ' + seasonNum + ', ' + ep.episode_number + ')">',
                '<div class="ep-number">' + ep.episode_number + '</div>',
                imgHtml,
                '<div class="ep-info">',
                    '<div class="ep-title">' + (ep.name || 'Episodio ' + ep.episode_number) + '</div>',
                    '<div class="ep-desc">' + (ep.overview || 'Nessuna trama disponibile') + '</div>',
                '</div>',
                '<div class="ep-duration">' + (ep.runtime ? ep.runtime + 'm' : '') + '</div>',
            '</div>'
        ].join('');
    }).join('');
}

/**
 * Chiude il player modale e gestisce la pulizia delle risorse (ES5-compatibile)
 */
function closePlayer() {
    var playerContainer = document.getElementById("player-container");
    if (!playerContainer) return;
    
    // 1. Chiudi il player video se aperto
    if (window.hls) {
        window.hls.destroy();
        window.hls = null;
    }
    
    var video = playerContainer.querySelector('video');
    if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
    }
    
    // 2. Pulisci i modali
    var episodeModal = document.getElementById("episodes-container");
    if (episodeModal && episodeModal.parentNode) {
        episodeModal.parentNode.removeChild(episodeModal);
    }
    
    var seasonsModal = document.getElementById("seasons-container");
    if (seasonsModal && seasonsModal.parentNode) {
        seasonsModal.parentNode.removeChild(seasonsModal);
    }
    
    // 3. Ripristina lo stato della pagina
    playerContainer.style.display = 'none';
    document.body.style.overflow = 'auto';
    
    // 4. Ripristino avanzato del focus
    var previousElement = null;
    
    // Prova a recuperare l'elemento direttamente
    if (playerContainer.dataset.previousElement) {
        previousElement = playerContainer.dataset.previousElement;
    } 
    // Fallback: recupera tramite ID
    else if (playerContainer.dataset.previousFocus) {
        previousElement = document.getElementById(playerContainer.dataset.previousFocus);
    }
    
    // Ripristina il focus se l'elemento esiste ancora nel DOM
    if (previousElement && document.body.contains(previousElement)) {
        try {
            previousElement.focus();
            // console.log('Focus ripristinato su:', previousElement);
        } catch (e) {
            console.warn('Impossibile ripristinare il focus:', e);
        }
    }
    
    // 5. Aggiorna la navigazione TV
    if (typeof navigation !== 'undefined' && navigation) {
        navigation.refreshFocusableElements();
        
        // Se non è stato possibile ripristinare il focus, fallback al primo elemento
        if (!previousElement || !document.body.contains(previousElement)) {
            navigation.focusElement(0);
        }
    }
}

// Listener per il tasto back/escape (ES5-compatibile)
document.addEventListener('DOMContentLoaded', function() {

    document.addEventListener('keydown', function(e) {
        var key = e.key || String.fromCharCode(e.keyCode);
        if (key === 'Backspace' || key === 'Escape' || e.keyCode === 27 || e.keyCode === 10009) {
            var playerContainer = document.getElementById("player-container");
            if (playerContainer && playerContainer.style.display === 'flex') {
                e.preventDefault();
                closePlayer();
            }
        }
    });
});
